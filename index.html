  // ---------- Skill tests ----------

  const SKILL_TESTS_KEY = 'workout-tracker:skill-tests';
  const SHOTS_PER_SPOT_KEY = 'workout-tracker:shots-per-spot';
  const SKILL_TEST_PROGRESS_KEY = 'workout-tracker:skill-test-progress';
  const DEFAULT_SHOTS_PER_SPOT = 10;
  const MIN_SHOTS_PER_SPOT = 1;
  const MAX_SHOTS_PER_SPOT = 50;
  const RETEST_LOCK_DAYS = 14;
  const DRILL_SECONDS = 60;
  const DRILL_REST_SECONDS = 15;

  const BALL_DRILLS = [
    { id: 'pound-high', label: 'Pound dribbles, high' },
    { id: 'pound-mid', label: 'Pound dribbles, mid' },
    { id: 'pound-low', label: 'Pound dribbles, low' },
    { id: 'in-and-outs', label: 'In and outs', split: { right: 'Right hand', left: 'Left hand' } },
    { id: 'between-legs', label: 'Between the legs', split: { right: 'Starting right', left: 'Starting left' } },
    { id: 'behind-back', label: 'Behind the back' },
    {
      id: 'combo',
      label: 'Combo sequence',
      note: 'Pound, in and out, crossover, between the legs, behind the back. Each full sequence counts as 1 rep.'
    }
  ];

  const COURT_SPOTS = [
    { id: 'left-corner', label: 'Left corner' },
    { id: 'left-wing', label: 'Left wing' },
    { id: 'top-key', label: 'Top of the key' },
    { id: 'right-wing', label: 'Right wing' },
    { id: 'right-corner', label: 'Right corner' }
  ];

  const FREE_THROW_SPOT = { id: 'free-throw-line', label: 'Free throw line' };

  const SHOT_TYPES = [
    { id: 'free-throw', label: 'Free throws', short: 'Free throws', spots: [FREE_THROW_SPOT] },
    { id: 'three-catch', label: 'Three-pointers, catch & shoot', short: '3PT catch & shoot', spots: COURT_SPOTS },
    { id: 'three-dribble', label: 'Three-pointers, off the dribble', short: '3PT off the dribble', spots: COURT_SPOTS },
    { id: 'mid-catch', label: 'Mid-range, catch & shoot', short: 'Mid-range catch & shoot', spots: COURT_SPOTS },
    { id: 'mid-dribble', label: 'Mid-range, off the dribble', short: 'Mid-range off the dribble', spots: COURT_SPOTS }
  ];

  const ALL_SPOTS = [FREE_THROW_SPOT].concat(COURT_SPOTS);
  const SHOOTING_STATION_COUNT = SHOT_TYPES.reduce((n, t) => n + t.spots.length, 0);

  let drillClock = null;
  let audioCtx = null;

  function drillInfo(id) {
    return BALL_DRILLS.find(d => d.id === id) || null;
  }

  // Synthesized so the page stays a single file with no audio assets.
  // Created on a user gesture (the Start button) so iOS unlocks playback.
  function playBeep(count, freq, durationMs) {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const tone = freq || 880;
      const dur = (durationMs || 160) / 1000;
      for (let i = 0; i < count; i++) {
        const at = audioCtx.currentTime + i * (dur + 0.09);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = tone;
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.exponentialRampToValueAtTime(0.35, at + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(at);
        osc.stop(at + dur + 0.03);
      }
    } catch (e) {}
  }

  function loadSkillTests() {
    try {
      const raw = localStorage.getItem(SKILL_TESTS_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function saveSkillTests(tests) {
    try {
      localStorage.setItem(SKILL_TESTS_KEY, JSON.stringify(tests));
    } catch (e) {}
  }

  function clampShots(n) {
    if (!Number.isFinite(n)) return DEFAULT_SHOTS_PER_SPOT;
    return Math.min(MAX_SHOTS_PER_SPOT, Math.max(MIN_SHOTS_PER_SPOT, Math.round(n)));
  }

  function loadShotsPerSpot() {
    try {
      const raw = localStorage.getItem(SHOTS_PER_SPOT_KEY);
      return raw === null ? DEFAULT_SHOTS_PER_SPOT : clampShots(parseInt(raw, 10));
    } catch (e) {
      return DEFAULT_SHOTS_PER_SPOT;
    }
  }

  function saveShotsPerSpot(n) {
    try {
      localStorage.setItem(SHOTS_PER_SPOT_KEY, String(n));
    } catch (e) {}
  }

  // An in-progress test is persisted so a phone reload mid-session
  // doesn't discard stations already logged.
  function loadTestProgress() {
    try {
      const raw = localStorage.getItem(SKILL_TEST_PROGRESS_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      return parsed && Array.isArray(parsed.stations) && parsed.stations.length ? parsed : null;
    } catch (e) {
      return null;
    }
  }

  function saveTestProgress(progress) {
    try {
      localStorage.setItem(SKILL_TEST_PROGRESS_KEY, JSON.stringify(progress));
    } catch (e) {}
  }

  function clearTestProgress() {
    try {
      localStorage.removeItem(SKILL_TEST_PROGRESS_KEY);
    } catch (e) {}
  }

  let activeTest = loadTestProgress();

  function buildStations(shotsPerSpot) {
    const stations = [];
    SHOT_TYPES.forEach(type => {
      type.spots.forEach(spot => {
        stations.push({ kind: 'shooting', typeId: type.id, spotId: spot.id, shots: shotsPerSpot, makes: 0 });
      });
    });
    BALL_DRILLS.forEach(drill => {
      const station = { kind: 'ball-handling', drillId: drill.id, seconds: DRILL_SECONDS };
      if (drill.split) {
        station.repsRight = 0;
        station.repsLeft = 0;
      } else {
        station.reps = 0;
      }
      stations.push(station);
    });
    return stations;
  }

  function spotLabel(id) {
    const spot = ALL_SPOTS.find(s => s.id === id);
    return spot ? spot.label : id;
  }

  function typeLabel(id, short) {
    const type = SHOT_TYPES.find(t => t.id === id);
    if (!type) return id;
    return short ? type.short : type.label;
  }

  function pct(makes, shots) {
    return shots > 0 ? (makes / shots) * 100 : null;
  }

  function formatPct(value) {
    return value === null ? '—' : Math.round(value) + '%';
  }

  function formatClock(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  function formatCountdown(ms) {
    if (ms <= 0) return 'now';
    const totalMinutes = Math.ceil(ms / 60000);
    const days = Math.floor(totalMinutes / 1440);
    const hours = Math.floor((totalMinutes % 1440) / 60);
    const minutes = totalMinutes % 60;
    if (days > 0) return days + 'd ' + hours + 'h';
    if (hours > 0) return hours + 'h ' + minutes + 'm';
    return minutes + 'm';
  }

  function retestStatus() {
    const tests = loadSkillTests();
    if (tests.length === 0) return { tests, locked: false, isFirst: true, remainingMs: 0 };
    const last = tests[tests.length - 1];
    const unlockAt = last.completedAt + RETEST_LOCK_DAYS * 86400000;
    const remainingMs = unlockAt - Date.now();
    return { tests, locked: remainingMs > 0, isFirst: false, remainingMs, unlockAt };
  }

  // Percentages (not raw makes) drive every comparison, so changing the
  // shots-per-spot setting between tests keeps the matchup fair.
  function summarizeTest(test) {
    const shooting = test.stations.filter(s => s.kind === 'shooting');
    const totals = rows => rows.reduce((acc, r) => {
      acc.makes += r.makes;
      acc.shots += r.shots;
      return acc;
    }, { makes: 0, shots: 0 });

    const byType = SHOT_TYPES.map(type => {
      const t = totals(shooting.filter(s => s.typeId === type.id));
      return { id: type.id, label: type.short, makes: t.makes, shots: t.shots, pct: pct(t.makes, t.shots) };
    }).filter(r => r.shots > 0);

    const bySpot = COURT_SPOTS.map(spot => {
      const t = totals(shooting.filter(s => s.spotId === spot.id));
      return { id: spot.id, label: spot.label, makes: t.makes, shots: t.shots, pct: pct(t.makes, t.shots) };
    }).filter(r => r.shots > 0);

    const overall = totals(shooting);
    const ranked = bySpot.filter(r => r.pct !== null).slice().sort((a, b) => b.pct - a.pct);

    return {
      byType,
      bySpot,
      overall: { makes: overall.makes, shots: overall.shots, pct: pct(overall.makes, overall.shots) },
      strongest: ranked.length ? ranked[0] : null,
      weakest: ranked.length ? ranked[ranked.length - 1] : null,
      ballHandling: summarizeBallHandling(test)
    };
  }

  // Handles both the current seven-drill circuit and the single
  // ball-handling station saved by earlier versions of the app.
  function summarizeBallHandling(test) {
    const stations = test.stations.filter(s => s.kind === 'ball-handling');
    if (!stations.length) return { drills: [], legacy: false, hasHands: false, right: 0, left: 0, weakHand: null };

    if (stations.length === 1 && !stations[0].drillId) {
      return {
        legacy: true,
        hasHands: false,
        right: 0,
        left: 0,
        weakHand: null,
        drills: [{ id: 'legacy', label: '60-second test', reps: stations[0].reps || 0, split: null }]
      };
    }

    let right = 0;
    let left = 0;
    let hasHands = false;

    const drills = stations.map(station => {
      const info = drillInfo(station.drillId);
      const label = info ? info.label : station.drillId;
      if (info && info.split) {
        const r = station.repsRight || 0;
        const l = station.repsLeft || 0;
        hasHands = true;
        right += r;
        left += l;
        return { id: station.drillId, label, reps: r + l, right: r, left: l, split: info.split };
      }
      return { id: station.drillId, label, reps: station.reps || 0, split: null };
    });

    let weakHand = null;
    if (hasHands && right !== left) weakHand = right < left ? 'right' : 'left';
    else if (hasHands) weakHand = 'even';

    return { drills, legacy: false, hasHands, right, left, weakHand };
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function buildStepper(opts) {
    const wrap = el('div', 'st-stepper');
    const minus = el('button', 'st-step-btn', '−');
    minus.type = 'button';
    minus.setAttribute('aria-label', 'Decrease ' + (opts.ariaLabel || 'value'));

    const input = document.createElement('input');
    input.className = 'st-step-input';
    input.type = 'number';
    input.inputMode = 'numeric';
    input.min = String(opts.min);
    input.max = String(opts.max);
    input.value = String(opts.value);
    if (opts.ariaLabel) input.setAttribute('aria-label', opts.ariaLabel);

    const plus = el('button', 'st-step-btn', '+');
    plus.type = 'button';
    plus.setAttribute('aria-label', 'Increase ' + (opts.ariaLabel || 'value'));

    let value = opts.value;

    function sync(next, fromInput) {
      const clamped = Math.min(opts.max, Math.max(opts.min, Number.isFinite(next) ? Math.round(next) : opts.min));
      value = clamped;
      if (!fromInput || input.value !== String(clamped)) input.value = String(clamped);
      minus.disabled = clamped <= opts.min;
      plus.disabled = clamped >= opts.max;
      opts.onChange(clamped);
    }

    minus.addEventListener('click', () => sync(value - 1));
    plus.addEventListener('click', () => sync(value + 1));
    input.addEventListener('input', () => {
      if (input.value === '') return;
      sync(parseInt(input.value, 10), true);
    });
    input.addEventListener('blur', () => sync(parseInt(input.value, 10)));

    minus.disabled = value <= opts.min;
    plus.disabled = value >= opts.max;

    wrap.appendChild(minus);
    wrap.appendChild(input);
    wrap.appendChild(plus);
    return wrap;
  }

  function diffPct(current, baseline) {
    if (current === null || baseline === null || baseline === undefined) return null;
    return current - baseline;
  }

  function deltaEl(delta, unit) {
    const span = el('span', 'st-delta');
    if (delta === null) {
      span.classList.add('flat');
      span.textContent = ' —';
      return span;
    }
    const rounded = Math.round(delta);
    if (rounded > 0) {
      span.classList.add('up');
      span.textContent = ' ▲ +' + rounded + unit;
    } else if (rounded < 0) {
      span.classList.add('down');
      span.textContent = ' ▼ −' + Math.abs(rounded) + unit;
    } else {
      span.classList.add('flat');
      span.textContent = ' – 0' + unit;
    }
    return span;
  }

  function resultRow(row, baseRow) {
    const wrap = el('div', 'st-row');
    const top = el('div', 'st-row-top');
    top.appendChild(el('span', 'st-row-label', row.label));

    const value = el('span', 'st-row-value');
    value.appendChild(document.createTextNode(formatPct(row.pct)));
    value.appendChild(el('span', 'st-row-count', row.makes + '/' + row.shots));
    if (baseRow) value.appendChild(deltaEl(diffPct(row.pct, baseRow.pct), 'pt'));
    top.appendChild(value);
    wrap.appendChild(top);

    const track = el('div', 'st-bar-track');
    const fill = el('div', 'st-bar-fill');
    fill.style.width = (row.pct === null ? 0 : row.pct) + '%';
    track.appendChild(fill);
    wrap.appendChild(track);
    return wrap;
  }

  function renderTestResults(test, baseline) {
    const frag = document.createDocumentFragment();
    const summary = summarizeTest(test);
    const isBaseline = !baseline || baseline.id === test.id;
    const baseSummary = isBaseline ? null : summarizeTest(baseline);
    const findBase = (list, id) => (baseSummary ? list.find(r => r.id === id) : null);

    const headBlock = el('div', 'st-block');
    headBlock.appendChild(el('div', 'st-block-label', isBaseline ? 'Baseline results' : 'Latest test vs baseline'));

    const overall = el('div', 'st-overall');
    const overallValue = el('div', 'st-overall-value');
    overallValue.appendChild(document.createTextNode(formatPct(summary.overall.pct)));
    if (baseSummary) overallValue.appendChild(deltaEl(diffPct(summary.overall.pct, baseSummary.overall.pct), 'pt'));
    overall.appendChild(overallValue);
    overall.appendChild(el('div', 'st-overall-label', 'Overall · ' + summary.overall.makes + '/' + summary.overall.shots + ' made'));
    headBlock.appendChild(overall);

    if (summary.strongest && summary.weakest) {
      const callout = el('div', 'st-callout');
      const strong = el('div');
      strong.appendChild(el('div', 'st-callout-label', 'Strongest spot'));
      strong.appendChild(el('div', 'st-callout-value', summary.strongest.label));
      strong.appendChild(el('div', 'st-callout-pct', formatPct(summary.strongest.pct)));
      const weak = el('div');
      weak.appendChild(el('div', 'st-callout-label', 'Weakest spot'));
      weak.appendChild(el('div', 'st-callout-value', summary.weakest.label));
      weak.appendChild(el('div', 'st-callout-pct', formatPct(summary.weakest.pct)));
      callout.appendChild(strong);
      callout.appendChild(weak);
      headBlock.appendChild(callout);
    }
    frag.appendChild(headBlock);

    const typeBlock = el('div', 'st-block');
    typeBlock.appendChild(el('div', 'st-block-label', 'By shot type'));
    summary.byType.forEach(row => typeBlock.appendChild(resultRow(row, findBase(baseSummary ? baseSummary.byType : [], row.id))));
    frag.appendChild(typeBlock);

    const spotBlock = el('div', 'st-block');
    spotBlock.appendChild(el('div', 'st-block-label', 'By spot · all shot types'));
    summary.bySpot.forEach(row => spotBlock.appendChild(resultRow(row, findBase(baseSummary ? baseSummary.bySpot : [], row.id))));
    frag.appendChild(spotBlock);

    const ball = summary.ballHandling;
    const baseBall = baseSummary ? baseSummary.ballHandling : null;
    if (ball.drills.length) {
      const ballBlock = el('div', 'st-block');
      ballBlock.appendChild(el('div', 'st-block-label', 'Ball handling · ' + DRILL_SECONDS + 's per drill'));

      if (ball.hasHands) {
        const weak = el('div', 'st-weak');
        const weakLabel = el('div', 'st-callout-label', 'Weak hand');
        weak.appendChild(weakLabel);
        if (ball.weakHand === 'even') {
          weak.appendChild(el('div', 'st-weak-value', 'Even · ' + ball.right + ' reps each side'));
        } else {
          const value = el('div', 'st-weak-value');
          value.appendChild(el('span', 'st-weak-hand', ball.weakHand === 'right' ? 'Right' : 'Left'));
          const strongTotal = ball.weakHand === 'right' ? ball.left : ball.right;
          const weakTotal = ball.weakHand === 'right' ? ball.right : ball.left;
          const gap = strongTotal > 0 ? Math.round(((strongTotal - weakTotal) / strongTotal) * 100) : 0;
          value.appendChild(document.createTextNode(' · ' + weakTotal + ' vs ' + strongTotal + ' reps (' + gap + '% behind)'));
          weak.appendChild(value);
        }
        weak.appendChild(el('div', 'st-weak-note', 'Across in and outs and between the legs.'));
        ballBlock.appendChild(weak);
      }

      ball.drills.forEach(drill => {
        const baseDrill = baseBall && !baseBall.legacy ? baseBall.drills.find(d => d.id === drill.id) : null;
        const row = el('div', 'st-row');
        const top = el('div', 'st-row-top');
        top.appendChild(el('span', 'st-row-label', drill.label));
        const value = el('span', 'st-row-value');
        value.appendChild(document.createTextNode(drill.reps + ' reps'));
        if (baseDrill) value.appendChild(deltaEl(drill.reps - baseDrill.reps, ''));
        top.appendChild(value);
        row.appendChild(top);

        if (drill.split) {
          const hands = el('div', 'st-hand-line');
          const rightSpan = el('span', ball.weakHand === 'right' ? 'st-hand weak' : 'st-hand',
            drill.split.right + ': ' + drill.right);
          const leftSpan = el('span', ball.weakHand === 'left' ? 'st-hand weak' : 'st-hand',
            drill.split.left + ': ' + drill.left);
          hands.appendChild(rightSpan);
          hands.appendChild(leftSpan);
          row.appendChild(hands);
        }
        ballBlock.appendChild(row);
      });

      if (baseBall && baseBall.legacy) {
        ballBlock.appendChild(el('div', 'st-note', 'Your baseline used the earlier single ball handling test, so drill-by-drill comparison starts from this test.'));
      }
      frag.appendChild(ballBlock);
    }

    const note = el('div', 'st-note');
    note.textContent = 'Taken ' + formatDateLabel(todayKey(test.completedAt)) + ' · ' + test.shotsPerSpot + ' shots per spot'
      + (isBaseline ? ' · this is your baseline.' : '. Comparisons use percentages, so they stay fair if you change shots per spot.');
    frag.appendChild(note);

    return frag;
  }

  function renderSkillTestIdle() {
    const status = retestStatus();
    const tests = status.tests;
    const latest = tests.length ? tests[tests.length - 1] : null;
    const baseline = tests.length ? tests[0] : null;

    const head = el('div', 'st-head');
    const headText = el('div');
    headText.appendChild(el('div', 'st-title', status.isFirst ? 'Baseline test' : 'Retest'));
    const sub = el('div', 'st-sub');
    if (status.isFirst) {
      sub.textContent = 'Sets your starting point. The app walks you through one station at a time.';
    } else if (status.locked) {
      sub.textContent = 'Retests unlock ' + RETEST_LOCK_DAYS + ' days after your last test, so each comparison covers real training time.';
    } else {
      sub.textContent = 'Same test, same order. Results are compared against your baseline.';
    }
    headText.appendChild(sub);
    head.appendChild(headText);
    if (!status.isFirst) {
      head.appendChild(el('span', 'st-pill' + (status.locked ? ' locked' : ''), status.locked ? 'Locked' : 'Available'));
    }
    skillTestCard.appendChild(head);

    const steps = el('ol', 'st-steps');
    SHOT_TYPES.forEach(type => {
      const count = type.spots.length;
      steps.appendChild(el('li', null, type.label + (count > 1 ? ' — ' + count + ' spots' : '')));
    });
    const ballStep = el('li', null, 'Ball handling — ' + BALL_DRILLS.length + ' timed drills, ' + DRILL_SECONDS + 's each');
    const drillList = el('ol', 'st-substeps');
    BALL_DRILLS.forEach(drill => {
      drillList.appendChild(el('li', null, drill.label + (drill.split ? ' (30s / 30s)' : '')));
    });
    ballStep.appendChild(drillList);
    steps.appendChild(ballStep);
    skillTestCard.appendChild(steps);

    const setting = el('div', 'st-setting');
    setting.appendChild(el('span', 'st-setting-label', 'Shots per spot'));
    const totalNote = el('div', 'st-note');
    const describeTotal = n => SHOOTING_STATION_COUNT + ' shooting stations · ' + (SHOOTING_STATION_COUNT * n)
      + ' shots total, plus ' + BALL_DRILLS.length + ' ball handling drills of ' + DRILL_SECONDS + 's each with '
      + DRILL_REST_SECONDS + 's rest between them.';
    totalNote.textContent = describeTotal(loadShotsPerSpot());
    setting.appendChild(buildStepper({
      value: loadShotsPerSpot(),
      min: MIN_SHOTS_PER_SPOT,
      max: MAX_SHOTS_PER_SPOT,
      ariaLabel: 'Shots per spot',
      onChange: value => {
        saveShotsPerSpot(value);
        totalNote.textContent = describeTotal(value);
      }
    }));
    skillTestCard.appendChild(setting);
    skillTestCard.appendChild(totalNote);

    const actions = el('div', 'st-actions');
    const startBtn = el('button', 'primary', status.isFirst ? 'Start baseline test' : 'Start retest');
    startBtn.type = 'button';
    startBtn.id = 'st-start-btn';
    startBtn.disabled = status.locked;
    startBtn.addEventListener('click', startTest);
    actions.appendChild(startBtn);
    skillTestCard.appendChild(actions);

    if (status.locked) {
      const lockNote = el('div', 'st-note');
      lockNote.appendChild(document.createTextNode('Unlocks in '));
      const countdown = el('strong', null, formatCountdown(status.remainingMs));
      countdown.id = 'st-countdown';
      lockNote.appendChild(countdown);
      lockNote.appendChild(document.createTextNode(' · last test: ' + formatDateLabel(todayKey(latest.completedAt)) + '.'));
      skillTestCard.appendChild(lockNote);
    }

    if (latest) skillTestCard.appendChild(renderTestResults(latest, baseline));
  }

  function currentStation() {
    if (!activeTest) return null;
    return activeTest.stations[activeTest.index];
  }

  // Remaining time comes from wall-clock rather than a tick counter, so a
  // throttled background tab can't drift the drill short or long.
  function drillRemainingMs() {
    if (!drillClock) return 0;
    if (drillClock.paused) return drillClock.pausedRemaining;
    return Math.max(0, drillClock.endsAt - Date.now());
  }

  function clearDrillClock() {
    if (drillClock && drillClock.intervalId) clearInterval(drillClock.intervalId);
    drillClock = null;
  }

  function drillPhaseLabel() {
    if (!drillClock) return 'Ready';
    if (drillClock.mode === 'rest') return 'Rest';
    const station = currentStation();
    const drill = station ? drillInfo(station.drillId) : null;
    if (drill && drill.split) {
      return drillRemainingMs() > drillClock.totalMs / 2 ? drill.split.right : drill.split.left;
    }
    return 'Go';
  }

  function updateDrillDisplay() {
    const clock = document.getElementById('st-drill-clock');
    if (clock) clock.textContent = formatClock(Math.ceil(drillRemainingMs() / 1000));
    const phase = document.getElementById('st-drill-phase');
    if (phase) phase.textContent = drillPhaseLabel();
  }

  function nextStationIsDrill() {
    if (!activeTest) return false;
    const next = activeTest.stations[activeTest.index + 1];
    return !!next && next.kind === 'ball-handling';
  }

  function startDrillTimer() {
    const station = currentStation();
    if (!station || station.kind !== 'ball-handling') return;
    clearDrillClock();
    const totalMs = station.seconds * 1000;
    drillClock = {
      mode: 'drill',
      totalMs,
      endsAt: Date.now() + totalMs,
      firedHalf: false,
      paused: false,
      pausedRemaining: 0,
      intervalId: setInterval(tickDrill, 200)
    };
    playBeep(1);
    renderSkillTests();
  }

  function startRestTimer() {
    clearDrillClock();
    const totalMs = DRILL_REST_SECONDS * 1000;
    drillClock = {
      mode: 'rest',
      totalMs,
      endsAt: Date.now() + totalMs,
      firedHalf: true,
      paused: false,
      pausedRemaining: 0,
      intervalId: setInterval(tickDrill, 200)
    };
    renderSkillTests();
  }

  function tickDrill() {
    if (!drillClock || drillClock.paused) return;
    const remaining = drillRemainingMs();

    if (drillClock.mode === 'drill' && !drillClock.firedHalf && remaining <= drillClock.totalMs / 2) {
      drillClock.firedHalf = true;
      playBeep(2);
    }

    if (remaining <= 0) {
      if (drillClock.mode === 'drill') {
        playBeep(3, 560, 220);
        const rest = nextStationIsDrill();
        clearDrillClock();
        if (rest) startRestTimer();
        else renderSkillTests();
      } else {
        clearDrillClock();
        advanceToNextDrill();
      }
      return;
    }
    updateDrillDisplay();
  }

  function advanceToNextDrill() {
    if (!activeTest) return;
    const nextIndex = activeTest.index + 1;
    if (nextIndex >= activeTest.stations.length) {
      renderSkillTests();
      return;
    }
    activeTest.index = nextIndex;
    saveTestProgress(activeTest);
    if (activeTest.stations[nextIndex].kind === 'ball-handling') startDrillTimer();
    else renderSkillTests();
  }

  function toggleDrillPause() {
    if (!drillClock) return;
    if (drillClock.paused) {
      drillClock.endsAt = Date.now() + drillClock.pausedRemaining;
      drillClock.paused = false;
    } else {
      drillClock.pausedRemaining = drillRemainingMs();
      drillClock.paused = true;
    }
    renderSkillTests();
  }

  function goToStation(index) {
    clearDrillClock();
    activeTest.index = Math.min(activeTest.stations.length - 1, Math.max(0, index));
    saveTestProgress(activeTest);
    renderSkillTests();
  }

  function startTest() {
    const shotsPerSpot = loadShotsPerSpot();
    activeTest = {
      startedAt: Date.now(),
      shotsPerSpot,
      index: 0,
      stations: buildStations(shotsPerSpot)
    };
    saveTestProgress(activeTest);
    renderSkillTests();
  }

  function cancelTest() {
    if (!window.confirm('Cancel this test? Stations you already logged will be discarded.')) return;
    clearDrillClock();
    activeTest = null;
    clearTestProgress();
    renderSkillTests();
  }

  function finishTest() {
    clearDrillClock();
    const tests = loadSkillTests();
    tests.push({
      id: uid(),
      completedAt: Date.now(),
      shotsPerSpot: activeTest.shotsPerSpot,
      stations: activeTest.stations
    });
    saveSkillTests(tests);
    activeTest = null;
    clearTestProgress();
    renderSkillTests();
  }

  function renderActiveTest() {
    const stations = activeTest.stations;
    const index = Math.min(activeTest.index, stations.length - 1);
    const station = stations[index];
    const isLast = index === stations.length - 1;

    const progressLabel = el('div', 'st-progress-label');
    progressLabel.appendChild(el('span', null, 'Station ' + (index + 1) + ' of ' + stations.length));
    const progressContext = station.kind === 'ball-handling'
      ? 'Ball handling ' + (BALL_DRILLS.findIndex(d => d.id === station.drillId) + 1) + '/' + BALL_DRILLS.length
      : typeLabel(station.typeId, true);
    progressLabel.appendChild(el('span', null, progressContext));
    skillTestCard.appendChild(progressLabel);

    const track = el('div', 'st-progress-track');
    const fill = el('div', 'st-progress-fill');
    fill.style.width = (((index + 1) / stations.length) * 100).toFixed(1) + '%';
    track.appendChild(fill);
    skillTestCard.appendChild(track);

    if (station.kind === 'shooting') {
      const stationEl = el('div', 'st-station');
      stationEl.appendChild(el('div', 'st-station-type', typeLabel(station.typeId)));
      stationEl.appendChild(el('div', 'st-station-spot', spotLabel(station.spotId)));
      stationEl.appendChild(el('div', 'st-station-shots', station.shots + ' shots'));
      skillTestCard.appendChild(stationEl);

      const makes = el('div', 'st-makes');
      makes.appendChild(el('div', 'st-makes-caption', 'Shots made'));
      const livePct = el('div', 'st-live-pct', formatPct(pct(station.makes, station.shots)));
      makes.appendChild(buildStepper({
        value: station.makes,
        min: 0,
        max: station.shots,
        ariaLabel: 'Shots made',
        onChange: value => {
          station.makes = value;
          livePct.textContent = formatPct(pct(value, station.shots));
          saveTestProgress(activeTest);
        }
      }));
      makes.appendChild(livePct);
      skillTestCard.appendChild(makes);
    } else {
      const drill = drillInfo(station.drillId);
      const drillNumber = BALL_DRILLS.findIndex(d => d.id === station.drillId) + 1;
      const resting = !!drillClock && drillClock.mode === 'rest';

      const stationEl = el('div', 'st-station');
      stationEl.appendChild(el('div', 'st-station-type', 'Ball handling · drill ' + drillNumber + ' of ' + BALL_DRILLS.length));
      stationEl.appendChild(el('div', 'st-station-spot', drill ? drill.label : station.drillId));
      let detail = station.seconds + ' seconds';
      if (drill && drill.split) detail = '30s ' + drill.split.right.toLowerCase() + ', then 30s ' + drill.split.left.toLowerCase();
      else if (drill && drill.note) detail = drill.note;
      stationEl.appendChild(el('div', 'st-station-shots', detail));
      skillTestCard.appendChild(stationEl);

      const phase = el('div', 'st-drill-phase' + (resting ? ' resting' : ''));
      phase.id = 'st-drill-phase';
      phase.textContent = drillPhaseLabel();
      skillTestCard.appendChild(phase);

      const clock = el('div', 'st-timer');
      clock.id = 'st-drill-clock';
      clock.textContent = formatClock(drillClock ? Math.ceil(drillRemainingMs() / 1000) : station.seconds);
      skillTestCard.appendChild(clock);

      const timerNote = el('div', 'st-timer-note');
      timerNote.textContent = resting
        ? 'Next: ' + (drillInfo(activeTest.stations[index + 1].drillId) || {}).label
        : (drillClock ? 'Beeps at the halfway mark and at the end.' : 'Beeps at the start, halfway and end.');
      skillTestCard.appendChild(timerNote);

      const timerActions = el('div', 'st-actions');
      if (resting) {
        const skip = el('button', 'secondary', 'Start next drill now');
        skip.type = 'button';
        skip.id = 'st-drill-skip';
        skip.addEventListener('click', () => {
          clearDrillClock();
          advanceToNextDrill();
        });
        timerActions.appendChild(skip);
      } else {
        const startBtn = el('button', 'secondary', drillClock ? (drillClock.paused ? 'Resume' : 'Pause') : 'Start drill');
        startBtn.type = 'button';
        startBtn.id = 'st-drill-btn';
        startBtn.addEventListener('click', () => (drillClock ? toggleDrillPause() : startDrillTimer()));
        timerActions.appendChild(startBtn);
        if (drillClock) {
          const reset = el('button', 'secondary', 'Reset');
          reset.type = 'button';
          reset.id = 'st-drill-reset';
          reset.addEventListener('click', () => {
            clearDrillClock();
            renderSkillTests();
          });
          timerActions.appendChild(reset);
        }
      }
      skillTestCard.appendChild(timerActions);

      if (drill && drill.split) {
        const hands = el('div', 'st-hand-grid');
        [['right', drill.split.right, 'repsRight'], ['left', drill.split.left, 'repsLeft']].forEach(entry => {
          const side = el('div', 'st-hand-col');
          side.appendChild(el('div', 'st-makes-caption', entry[1]));
          side.appendChild(buildStepper({
            value: station[entry[2]] || 0,
            min: 0,
            max: 999,
            ariaLabel: entry[1] + ' reps',
            onChange: value => {
              station[entry[2]] = value;
              saveTestProgress(activeTest);
            }
          }));
          hands.appendChild(side);
        });
        skillTestCard.appendChild(hands);
      } else {
        const reps = el('div', 'st-makes');
        reps.appendChild(el('div', 'st-makes-caption', 'Reps completed'));
        reps.appendChild(buildStepper({
          value: station.reps || 0,
          min: 0,
          max: 999,
          ariaLabel: 'Reps completed',
          onChange: value => {
            station.reps = value;
            saveTestProgress(activeTest);
          }
        }));
        skillTestCard.appendChild(reps);
      }
    }

    const actions = el('div', 'st-actions');
    const back = el('button', 'secondary', 'Back');
    back.type = 'button';
    back.id = 'st-back-btn';
    back.disabled = index === 0;
    back.addEventListener('click', () => goToStation(index - 1));
    const next = el('button', 'primary', isLast ? 'Finish test' : 'Next');
    next.type = 'button';
    next.id = 'st-next-btn';
    next.addEventListener('click', () => (isLast ? finishTest() : goToStation(index + 1)));
    actions.appendChild(back);
    actions.appendChild(next);
    skillTestCard.appendChild(actions);

    const cancel = el('button', 'st-cancel', 'Cancel test');
    cancel.type = 'button';
    cancel.id = 'st-cancel-btn';
    cancel.addEventListener('click', cancelTest);
    skillTestCard.appendChild(cancel);
  }

  function renderSkillTests() {
    skillTestCard.innerHTML = '';
    if (activeTest) renderActiveTest();
    else renderSkillTestIdle();
  }

  // Generic single-series line chart: 2px line, 10% area wash, end dot,
  // and a crosshair that snaps to the nearest point. No legend — the
  // block heading names the series.
  function buildLineChart(opts) {
    const wrap = el('div', 'pir-chart-wrap');
    const series = opts.points;

    if (series.length < 2) {
      wrap.appendChild(el('div', 'pir-chart-empty', opts.emptyText || 'Two games needed to plot a trend.'));
      return wrap;
    }

    const width = 320;
    const height = 120;
    const padLeft = 34;
    const padRight = 8;
    const padTop = 10;
    const padBottom = 20;
    const plotW = width - padLeft - padRight;
    const plotH = height - padTop - padBottom;

    const values = series.map(p => p.value);
    const maxValue = Math.max(...values, opts.minTop || 1);
    const xAt = i => padLeft + (i / (series.length - 1)) * plotW;
    const yAt = v => padTop + plotH - (v / maxValue) * plotH;

    const points = series.map((p, i) => [xAt(i), yAt(p.value)]);
    const linePath = points.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    const areaPath = linePath + ' L' + points[points.length - 1][0].toFixed(1) + ',' + (padTop + plotH).toFixed(1)
      + ' L' + points[0][0].toFixed(1) + ',' + (padTop + plotH).toFixed(1) + ' Z';

    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', opts.ariaLabel || 'Trend chart');

    [0, maxValue].forEach(v => {
      const y = yAt(v);
      const line = document.createElementNS(svgNS, 'line');
      line.setAttribute('x1', padLeft);
      line.setAttribute('x2', width - padRight);
      line.setAttribute('y1', y.toFixed(1));
      line.setAttribute('y2', y.toFixed(1));
      line.setAttribute('stroke', cssVar('--border'));
      line.setAttribute('stroke-width', '1');
      svg.appendChild(line);

      const label = document.createElementNS(svgNS, 'text');
      label.setAttribute('x', padLeft - 6);
      label.setAttribute('y', (y + 3).toFixed(1));
      label.setAttribute('text-anchor', 'end');
      label.setAttribute('font-size', '9');
      label.setAttribute('fill', cssVar('--text-dim'));
      label.textContent = opts.formatAxis ? opts.formatAxis(v) : Math.round(v);
      svg.appendChild(label);
    });

    [0, series.length - 1].forEach(i => {
      const label = document.createElementNS(svgNS, 'text');
      label.setAttribute('x', points[i][0].toFixed(1));
      label.setAttribute('y', height - 4);
      label.setAttribute('text-anchor', i === 0 ? 'start' : 'end');
      label.setAttribute('font-size', '9');
      label.setAttribute('fill', cssVar('--text-dim'));
      label.textContent = series[i].axisLabel;
      svg.appendChild(label);
    });

    const area = document.createElementNS(svgNS, 'path');
    area.setAttribute('d', areaPath);
    area.setAttribute('fill', cssVar('--accent'));
    area.setAttribute('fill-opacity', '0.1');
    svg.appendChild(area);

    const line = document.createElementNS(svgNS, 'path');
    line.setAttribute('d', linePath);
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', cssVar('--accent'));
    line.setAttribute('stroke-width', '2');
    line.setAttribute('stroke-linecap', 'round');
    line.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(line);

    const last = points[points.length - 1];
    const endDot = document.createElementNS(svgNS, 'circle');
    endDot.setAttribute('cx', last[0].toFixed(1));
    endDot.setAttribute('cy', last[1].toFixed(1));
    endDot.setAttribute('r', '5');
    endDot.setAttribute('fill', cssVar('--accent'));
    endDot.setAttribute('stroke', cssVar('--card'));
    endDot.setAttribute('stroke-width', '2');
    svg.appendChild(endDot);

    const crosshair = document.createElementNS(svgNS, 'line');
    crosshair.setAttribute('y1', padTop);
    crosshair.setAttribute('y2', padTop + plotH);
    crosshair.setAttribute('stroke', cssVar('--text-dim'));
    crosshair.setAttribute('stroke-width', '1');
    crosshair.setAttribute('opacity', '0');
    svg.appendChild(crosshair);

    const hoverDot = document.createElementNS(svgNS, 'circle');
    hoverDot.setAttribute('r', '5');
    hoverDot.setAttribute('fill', cssVar('--accent'));
    hoverDot.setAttribute('stroke', cssVar('--card'));
    hoverDot.setAttribute('stroke-width', '2');
    hoverDot.setAttribute('opacity', '0');
    svg.appendChild(hoverDot);

    const hit = document.createElementNS(svgNS, 'rect');
    hit.setAttribute('x', padLeft);
    hit.setAttribute('y', 0);
    hit.setAttribute('width', plotW);
    hit.setAttribute('height', height);
    hit.setAttribute('fill', 'transparent');
    svg.appendChild(hit);

    const tooltip = el('div', 'chart-tooltip');
    wrap.appendChild(svg);
    wrap.appendChild(tooltip);

    function showAt(clientX) {
      const rect = svg.getBoundingClientRect();
      const relX = ((clientX - rect.left) / rect.width) * width;
      let nearest = 0;
      let bestDist = Infinity;
      points.forEach((p, i) => {
        const dist = Math.abs(p[0] - relX);
        if (dist < bestDist) { bestDist = dist; nearest = i; }
      });
      const [px, py] = points[nearest];
      crosshair.setAttribute('x1', px.toFixed(1));
      crosshair.setAttribute('x2', px.toFixed(1));
      crosshair.setAttribute('opacity', '1');
      hoverDot.setAttribute('cx', px.toFixed(1));
      hoverDot.setAttribute('cy', py.toFixed(1));
      hoverDot.setAttribute('opacity', '1');

      tooltip.innerHTML = '';
      const valueSpan = el('span', 'tt-value', opts.formatValue(series[nearest].value));
      tooltip.appendChild(valueSpan);
      tooltip.appendChild(document.createTextNode(' · ' + series[nearest].label));
      tooltip.style.left = ((px / width) * 100) + '%';
      tooltip.style.top = ((py / height) * 100) + '%';
      tooltip.classList.add('visible');
    }

    hit.addEventListener('pointermove', e => showAt(e.clientX));
    hit.addEventListener('pointerdown', e => showAt(e.clientX));
    hit.addEventListener('pointerleave', () => {
      crosshair.setAttribute('opacity', '0');
      hoverDot.setAttribute('opacity', '0');
      tooltip.classList.remove('visible');
    });

    return wrap;
  }

  function renderGames() {
    gamesCard.innerHTML = '';
    const seasons = loadSeasons();
    const allGames = loadGames();
    const games = filteredGames();
    const played = playedGamesOf(games);
    const summary = aggregateGames(games);
    const highs = seasonHighs(games);

    const controls = el('div', 'game-controls');

    const seasonSelect = document.createElement('select');
    seasonSelect.id = 'game-season-filter';
    const allSeasonOpt = document.createElement('option');
    allSeasonOpt.value = 'all';
    allSeasonOpt.textContent = 'All seasons';
    seasonSelect.appendChild(allSeasonOpt);
    seasons.forEach(season => {
      const opt = document.createElement('option');
      opt.value = season.id;
      opt.textContent = season.name;
      seasonSelect.appendChild(opt);
    });
    seasonSelect.value = gameSeasonFilter;
    seasonSelect.addEventListener('change', () => {
      gameSeasonFilter = seasonSelect.value;
      render();
    });
    controls.appendChild(seasonSelect);

    const typeSelect = document.createElement('select');
    typeSelect.id = 'game-type-filter';
    const allTypeOpt = document.createElement('option');
    allTypeOpt.value = 'all';
    allTypeOpt.textContent = 'All game types';
    typeSelect.appendChild(allTypeOpt);
    GAME_TYPES.forEach(type => {
      const opt = document.createElement('option');
      opt.value = type.id;
      opt.textContent = type.label;
      typeSelect.appendChild(opt);
    });
    typeSelect.value = gameTypeFilter;
    typeSelect.addEventListener('change', () => {
      gameTypeFilter = typeSelect.value;
      render();
    });
    controls.appendChild(typeSelect);
    gamesCard.appendChild(controls);

    const seasonRow = el('div', 'game-season-row');
    seasonRow.appendChild(el('span', 'game-season-active', 'New games go to: ' + ensureActiveSeason().name));
    const newSeasonBtn = el('button', 'cal-mini-btn', 'Start new season');
    newSeasonBtn.type = 'button';
    newSeasonBtn.id = 'new-season-btn';
    newSeasonBtn.addEventListener('click', startNewSeason);
    seasonRow.appendChild(newSeasonBtn);
    gamesCard.appendChild(seasonRow);

    if (!allGames.length) {
      gamesCard.appendChild(el('div', 'empty-state',
        'Mark a day on the calendar as a game day to start tracking games.'));
      return;
    }

    if (summary) {
      const avgBlock = el('div', 'st-block');
      avgBlock.appendChild(el('div', 'st-block-label',
        'Season averages · ' + summary.games + (summary.games === 1 ? ' game' : ' games')
        + ' · ' + summary.wins + 'W–' + summary.losses + 'L'));

      const grid = el('div', 'stat-grid');
      [
        ['PPG', summary.per.pts], ['RPG', summary.per.reb], ['APG', summary.per.ast],
        ['SPG', summary.per.stl], ['BPG', summary.per.blk], ['TOPG', summary.per.tov],
        ['MPG', summary.per.min]
      ].forEach(pair => {
        const tile = el('div', 'stat-tile');
        tile.appendChild(el('div', 'stat-tile-value', formatStatAvg(pair[1])));
        tile.appendChild(el('div', 'stat-tile-label', pair[0]));
        grid.appendChild(tile);
      });
      avgBlock.appendChild(grid);

      const shootingGrid = el('div', 'stat-grid');
      [
        ['FG%', summary.pcts.fg], ['3PT%', summary.pcts.tp],
        ['FT%', summary.pcts.ft], ['TS%', summary.pcts.ts]
      ].forEach(pair => {
        const tile = el('div', 'stat-tile');
        tile.appendChild(el('div', 'stat-tile-value', formatPctStat(pair[1])));
        tile.appendChild(el('div', 'stat-tile-label', pair[0]));
        shootingGrid.appendChild(tile);
      });
      avgBlock.appendChild(shootingGrid);
      avgBlock.appendChild(el('div', 'st-note',
        'Shooting percentages come from season totals (' + summary.totals.fgm + '/' + summary.totals.fga + ' FG, '
        + summary.totals.tpm + '/' + summary.totals.tpa + ' 3PT, ' + summary.totals.ftm + '/' + summary.totals.fta
        + ' FT), not from averaging each game’s percentage.'));
      gamesCard.appendChild(avgBlock);

      const highBlock = el('div', 'st-block');
      highBlock.appendChild(el('div', 'st-block-label', 'Season highs'));
      HIGH_STATS.forEach(stat => {
        const high = highs[stat.id];
        if (!high) return;
        const row = el('div', 'st-row-top');
        row.appendChild(el('span', 'st-row-label', stat.label));
        const value = el('span', 'st-row-value');
        value.appendChild(document.createTextNode(String(high.value)));
        value.appendChild(el('span', 'st-row-count',
          (high.game.opponent ? 'vs ' + high.game.opponent : '') + ' · ' + formatDayTitle(high.game.date)));
        row.appendChild(value);
        highBlock.appendChild(row);
      });
      gamesCard.appendChild(highBlock);

      const chartBlock = el('div', 'st-block');
      chartBlock.appendChild(el('div', 'st-block-label', 'Points per game'));
      chartBlock.appendChild(buildLineChart({
        points: played.map(g => ({
          value: g.stats.pts,
          label: (g.opponent ? 'vs ' + g.opponent : formatDayTitle(g.date)),
          axisLabel: shortDate(g.date)
        })),
        formatValue: v => v + ' pts',
        ariaLabel: 'Points per game over the season'
      }));
      gamesCard.appendChild(chartBlock);

      const tsPoints = played
        .map(g => ({ game: g, ts: gamePercentages(g.stats).ts }))
        .filter(row => row.ts !== null);
      const tsBlock = el('div', 'st-block');
      tsBlock.appendChild(el('div', 'st-block-label', 'True shooting % per game'));
      tsBlock.appendChild(buildLineChart({
        points: tsPoints.map(row => ({
          value: row.ts,
          label: (row.game.opponent ? 'vs ' + row.game.opponent : formatDayTitle(row.game.date)),
          axisLabel: shortDate(row.game.date)
        })),
        formatValue: v => v.toFixed(1) + '%',
        formatAxis: v => Math.round(v) + '%',
        ariaLabel: 'True shooting percentage per game over the season'
      }));
      gamesCard.appendChild(tsBlock);
    }

    const logBlock = el('div', 'st-block');
    logBlock.appendChild(el('div', 'st-block-label', 'Game log'));
    if (!games.length) {
      logBlock.appendChild(el('div', 'empty-state', 'No games match these filters.'));
    }
    games.slice().reverse().forEach(game => logBlock.appendChild(renderGameLogEntry(game, highs)));
    gamesCard.appendChild(logBlock);
  }

  function shortDate(dateKey) {
    return new Date(dateKey + 'T00:00:00Z')
      .toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' });
  }

  function startNewSeason() {
    const seasons = loadSeasons();
    const suggested = new Date(Date.now()).getUTCFullYear() + ' Season';
    const name = window.prompt('Name this season', seasons.length ? suggested : suggested);
    if (name === null) return;
    const trimmed = name.trim();
    if (!trimmed) return;
    const season = { id: uid(), name: trimmed, startedAt: Date.now() };
    seasons.push(season);
    saveSeasons(seasons);
    saveActiveSeasonId(season.id);
    gameSeasonFilter = season.id;
    render();
  }

  function renderGameLogEntry(game, highs) {
    const wrap = el('div', 'game-entry');
    const expanded = expandedGames.has(game.id);

    const header = el('button', 'game-entry-head');
    header.type = 'button';
    header.addEventListener('click', () => {
      if (expanded) expandedGames.delete(game.id);
      else expandedGames.add(game.id);
      render();
    });

    const left = el('div', 'game-entry-left');
    const title = el('div', 'game-entry-title', (game.opponent ? 'vs ' + game.opponent : 'Game'));
    left.appendChild(title);
    left.appendChild(el('div', 'game-entry-meta',
      shortDate(game.date) + ' · ' + gameTypeLabel(game.type, true) + ' · ' + seasonName(game.seasonId)));
    header.appendChild(left);

    const right = el('div', 'game-entry-right');
    if (game.played && game.stats) {
      right.appendChild(el('div', 'game-entry-pts', game.stats.pts + ' PTS'));
      right.appendChild(el('div', 'game-entry-line',
        gameRebounds(game.stats) + ' REB · ' + game.stats.ast + ' AST'));
    } else {
      right.appendChild(el('div', 'game-entry-line', 'Scheduled'));
    }
    if (game.result) {
      right.appendChild(el('span', 'cal-game-result ' + game.result, game.result === 'win' ? 'W' : 'L'));
    }
    header.appendChild(right);
    wrap.appendChild(header);

    const holdsHigh = HIGH_STATS.filter(stat => {
      const high = highs[stat.id];
      return high && high.game.id === game.id;
    });
    if (holdsHigh.length) {
      const tags = el('div', 'game-high-tags');
      holdsHigh.forEach(stat => tags.appendChild(el('span', 'game-high-tag', 'Season high: ' + stat.label)));
      wrap.appendChild(tags);
    }

    if (expanded) {
      if (game.played && game.stats) {
        const pcts = gamePercentages(game.stats);
        const box = el('div', 'box-score');
        STAT_FIELDS.forEach(field => {
          const cell = el('div', 'box-cell');
          cell.appendChild(el('div', 'box-cell-value', String(game.stats[field.id] || 0)));
          cell.appendChild(el('div', 'box-cell-label', field.short));
          box.appendChild(cell);
        });
        wrap.appendChild(box);

        const pctRow = el('div', 'stat-grid');
        [['FG%', pcts.fg], ['3PT%', pcts.tp], ['FT%', pcts.ft], ['TS%', pcts.ts]].forEach(pair => {
          const tile = el('div', 'stat-tile');
          tile.appendChild(el('div', 'stat-tile-value', formatPctStat(pair[1])));
          tile.appendChild(el('div', 'stat-tile-label', pair[0]));
          pctRow.appendChild(tile);
        });
        wrap.appendChild(pctRow);
      }

      const actions = el('div', 'cal-game-actions');
      const editBtn = el('button', 'cal-mini-btn', game.played ? 'Edit box score' : 'Add box score');
      editBtn.type = 'button';
      editBtn.addEventListener('click', () => {
        editingGameId = editingGameId === game.id ? null : game.id;
        render();
      });
      actions.appendChild(editBtn);
      const removeBtn = el('button', 'cal-mini-btn danger', 'Remove game');
      removeBtn.type = 'button';
      removeBtn.addEventListener('click', () => {
        if (!window.confirm('Remove this game' + (game.played ? ' and its box score' : '') + '?')) return;
        saveGames(loadGames().filter(g => g.id !== game.id));
        expandedGames.delete(game.id);
        if (editingGameId === game.id) editingGameId = null;
        render();
      });
      actions.appendChild(removeBtn);
      wrap.appendChild(actions);
    }

    if (editingGameId === game.id) wrap.appendChild(renderStatForm(game));
    return wrap;
  }

  function renderStatForm(game) {
    const form = el('form', 'stat-form');
    form.id = 'stat-form';
    form.appendChild(el('div', 'cal-log-label',
      'Box score · ' + (game.opponent ? 'vs ' + game.opponent : 'Game') + ' · ' + shortDate(game.date)));

    const inputs = {};
    const grid = el('div', 'stat-input-grid');
    STAT_FIELDS.forEach(field => {
      const cell = el('div', 'stat-input');
      const label = document.createElement('label');
      label.setAttribute('for', 'stat-' + field.id);
      label.textContent = field.short;
      const input = document.createElement('input');
      input.type = 'number';
      input.id = 'stat-' + field.id;
      input.inputMode = 'numeric';
      input.min = '0';
      input.value = game.stats ? String(game.stats[field.id] || 0) : '0';
      input.setAttribute('aria-label', field.label);
      inputs[field.id] = input;
      cell.appendChild(label);
      cell.appendChild(input);
      grid.appendChild(cell);
    });
    form.appendChild(grid);

    const live = el('div', 'stat-grid');
    const liveTiles = {};
    [['FG%', 'fg'], ['3PT%', 'tp'], ['FT%', 'ft'], ['TS%', 'ts']].forEach(pair => {
      const tile = el('div', 'stat-tile');
      const value = el('div', 'stat-tile-value', '—');
      liveTiles[pair[1]] = value;
      tile.appendChild(value);
      tile.appendChild(el('div', 'stat-tile-label', pair[0]));
      live.appendChild(tile);
    });
    form.appendChild(live);

    function readStats() {
      const stats = {};
      STAT_FIELDS.forEach(field => {
        const parsed = parseInt(inputs[field.id].value, 10);
        stats[field.id] = Number.isFinite(parsed) && parsed > 0 ? parsed : 0;
      });
      return stats;
    }

    function refreshLive() {
      const pcts = gamePercentages(readStats());
      liveTiles.fg.textContent = formatPctStat(pcts.fg);
      liveTiles.tp.textContent = formatPctStat(pcts.tp);
      liveTiles.ft.textContent = formatPctStat(pcts.ft);
      liveTiles.ts.textContent = formatPctStat(pcts.ts);
    }
    STAT_FIELDS.forEach(field => inputs[field.id].addEventListener('input', refreshLive));
    refreshLive();

    const resultRow = el('div', 'result-row');
    resultRow.appendChild(el('span', 'stat-input-caption', 'Result'));
    let chosenResult = game.result || null;
    const resultButtons = {};
    [['win', 'Win'], ['loss', 'Loss']].forEach(pair => {
      const btn = el('button', 'result-btn' + (chosenResult === pair[0] ? ' active' : ''), pair[1]);
      btn.type = 'button';
      btn.id = 'result-' + pair[0];
      btn.addEventListener('click', () => {
        chosenResult = pair[0];
        Object.keys(resultButtons).forEach(key => {
          resultButtons[key].classList.toggle('active', key === chosenResult);
        });
        error.textContent = '';
      });
      resultButtons[pair[0]] = btn;
      resultRow.appendChild(btn);
    });
    form.appendChild(resultRow);

    const error = el('div', 'stat-error');
    error.id = 'stat-error';
    form.appendChild(error);

    const actions = el('div', 'cal-log-row');
    const cancel = el('button', 'secondary', 'Cancel');
    cancel.type = 'button';
    cancel.addEventListener('click', () => {
      editingGameId = null;
      render();
    });
    const submit = el('button', 'primary', 'Save box score');
    submit.type = 'submit';
    submit.id = 'stat-save';
    actions.appendChild(cancel);
    actions.appendChild(submit);
    form.appendChild(actions);

    form.addEventListener('submit', e => {
      e.preventDefault();
      const stats = readStats();

      const bad = MADE_ATTEMPT_PAIRS.find(pair => stats[pair[0]] > stats[pair[1]]);
      if (bad) {
        error.textContent = 'Made ' + bad[2] + ' (' + stats[bad[0]] + ') can’t exceed attempts (' + stats[bad[1]] + ').';
        return;
      }
      if (!chosenResult) {
        error.textContent = 'Pick a result — win or loss.';
        return;
      }

      const games = loadGames();
      const target = games.find(g => g.id === game.id);
      if (!target) return;
      target.stats = stats;
      target.result = chosenResult;
      target.played = true;
      saveGames(games);
      editingGameId = null;
      expandedGames.add(game.id);
      render();
    });

    return form;
  }

  function render() {
    const pir = computePIR();
    renderCalendar(pir);
    renderPIR(pir);
    renderGames();
    renderSkillTests();
    renderChips();

    const inFilter = w => activeCategory === 'all' || (w.category || DEFAULT_CATEGORY) === activeCategory;

    // Pending (not done) workouts, newest first
    const pending = workouts.filter(w => !w.done && inFilter(w)).sort((a, b) => b.createdAt - a.createdAt);
    todayList.innerHTML = '';
    pending.forEach(w => todayList.appendChild(renderItem(w)));
    todayEmpty.hidden = pending.length > 0;
    todayCount.textContent = pending.length ? `(${pending.length})` : '';

    // Completed workouts, grouped by completion date, newest first
    const done = workouts.filter(w => w.done && inFilter(w)).sort((a, b) => b.completedAt - a.completedAt);
    historyContainer.innerHTML = '';
    historyEmpty.hidden = done.length > 0;

    const groups = new Map();
    done.forEach(w => {
      const key = todayKey(w.completedAt);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(w);
    });

    groups.forEach((items, key) => {
      const label = document.createElement('div');
      label.className = 'history-date';
      label.textContent = formatDateLabel(key);
      historyContainer.appendChild(label);

      const ul = document.createElement('ul');
      ul.className = 'items';
      items.forEach(w => ul.appendChild(renderItem(w)));
      historyContainer.appendChild(ul);
    });
  }

  function renderItem(w) {
    const li = document.createElement('li');
    li.className = 'item' + (w.done ? ' done' : '');

    const check = document.createElement('button');
    check.className = 'check';
    check.type = 'button';
    check.textContent = '✓';
    check.setAttribute('aria-label', w.done ? 'Mark as not done' : 'Mark as done');
    check.addEventListener('click', () => toggleDone(w.id));

    const info = document.createElement('div');
    info.className = 'item-info';
    const nameEl = document.createElement('div');
    nameEl.className = 'item-name';
    nameEl.textContent = w.name;
    const metaEl = document.createElement('div');
    metaEl.className = 'item-meta';
    metaEl.textContent = `${w.sets} sets × ${w.reps} reps`;

    const cat = categoryInfo(w.category || DEFAULT_CATEGORY);
    const badgeEl = document.createElement('div');
    badgeEl.className = 'category-badge';
    badgeEl.textContent = cat.label;
    badgeEl.style.background = cat.color + '26';
    badgeEl.style.color = cat.color;

    info.appendChild(nameEl);
    info.appendChild(metaEl);
    info.appendChild(badgeEl);

    const del = document.createElement('button');
    del.className = 'delete-btn';
    del.type = 'button';
    del.textContent = 'Delete';
    del.addEventListener('click', () => removeWorkout(w.id));

    li.appendChild(check);
    li.appendChild(info);
    li.appendChild(del);
    return li;
  }

  function toggleDone(id) {
    const w = workouts.find(w => w.id === id);
    if (!w) return;
    w.done = !w.done;
    w.completedAt = w.done ? Date.now() : null;
    save(workouts);
    render();
  }

  function removeWorkout(id) {
    workouts = workouts.filter(w => w.id !== id);
    save(workouts);
    render();
  }

  restDayBtn.addEventListener('click', toggleRestDay);

  // Keeps the retest countdown live, and re-renders the moment it unlocks.
  setInterval(() => {
    const countdown = document.getElementById('st-countdown');
    if (!countdown) return;
    const status = retestStatus();
    if (!status.locked) renderSkillTests();
    else countdown.textContent = formatCountdown(status.remainingMs);
  }, 60000);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = nameInput.value.trim();
    const category = categorySelect.value || DEFAULT_CATEGORY;
    const sets = parseInt(setsInput.value, 10);
    const reps = parseInt(repsInput.value, 10);
    if (!name || !sets || !reps) return;

    workouts.push({
      id: uid(),
      name,
      category,
      sets,
      reps,
      done: false,
      createdAt: Date.now(),
      completedAt: null
    });
    save(workouts);
    render();
    form.reset();
    categorySelect.value = DEFAULT_CATEGORY;
    nameInput.focus();
  });

  render();
})();
</script>
</body>
</html>
