<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFFFFF">
<title>Shai's Workout Tracker Test App</title>
<style>
  :root {
    color-scheme: light;
    --bg: #FFFFFF;
    --card: #F3EDE6;
    --text: #2E1B0F;
    --text-dim: #5C4130;
    --border: #E4D6C3;
    --accent: #5C4033;
    --accent-text: #FFFFFF;
    --done-bg: #EAD9BE;
    --done-border: #5C4033;
    --danger: #7A2E1E;
    --input-bg: #F3EDE6;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  img { max-width: 100%; }
  [hidden] { display: none !important; }

  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--bg);
    padding: 18px 0 10px;
    z-index: 10;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-top: 2px;
  }

  main {
    max-width: 560px;
    margin: 0 auto;
    padding-bottom: 48px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-top: 16px;
  }

  .add-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .add-form .row {
    display: flex;
    gap: 10px;
  }

  label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 4px;
    display: block;
  }

  input, select {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 11px 12px;
    font-size: 16px;
    color: var(--text);
    font-family: inherit;
  }

  select {
    appearance: none;
    -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 13px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }

  input:focus, select:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }

  .field { flex: 1; min-width: 0; }
  .field.small { flex: 0 0 30%; }

  button.primary {
    appearance: none;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 700;
    font-size: 16px;
    padding: 13px;
    border-radius: 6px;
    width: 100%;
    margin-top: 2px;
    cursor: pointer;
  }

  button.primary:active { opacity: 0.75; }

  section.list-section {
    margin-top: 28px;
  }

  h2 {
    font-size: 1.05rem;
    font-weight: 700;
    margin: 0 0 10px;
  }

  .count-badge {
    color: var(--text-dim);
    font-weight: 500;
    font-size: 0.85rem;
  }

  ul.items {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  li.item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  li.item.done {
    background: var(--done-bg);
    border-color: var(--done-border);
  }

  .check {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 4px;
    border: 2px solid var(--text-dim);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: transparent;
    font-size: 16px;
    font-weight: 800;
    padding: 0;
  }

  li.item.done .check {
    border-color: var(--done-border);
    background: var(--done-border);
    color: #ffffff;
  }

  .item-info { flex: 1; min-width: 0; }

  .item-name {
    font-weight: 600;
    font-size: 1rem;
    word-break: break-word;
  }

  li.item.done .item-name {
    text-decoration: line-through;
    color: var(--text-dim);
  }

  .item-meta {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-top: 2px;
  }

  .category-badge {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 7px;
    border-radius: 3px;
    margin-top: 6px;
  }

  .filter-chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 2px;
    margin: 14px 0 -4px;
    -webkit-overflow-scrolling: touch;
  }

  .filter-chips::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.82rem;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 5px;
    cursor: pointer;
  }

  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }

  .delete-btn {
    flex: 0 0 auto;
    background: transparent;
    border: none;
    color: var(--danger);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 6px 4px;
    cursor: pointer;
  }

  .empty-state {
    color: var(--text-dim);
    font-size: 0.9rem;
    text-align: center;
    padding: 24px 8px;
  }

  .history-date {
    color: var(--text-dim);
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 18px 0 8px;
  }

  .history-date:first-child { margin-top: 0; }
</style>
</head>
<body>
<header>
  <main style="padding-bottom:0;">
    <h1>Shai's Workout Tracker Test App</h1>
    <div class="subtitle">Track sets, reps, and completed workouts.</div>
  </main>
</header>

<main>
  <div class="card">
    <form class="add-form" id="add-form">
      <div class="field">
        <label for="name">Exercise</label>
        <input id="name" type="text" placeholder="e.g. Push ups" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="category">Category</label>
        <select id="category"></select>
      </div>
      <div class="row">
        <div class="field small">
          <label for="sets">Sets</label>
          <input id="sets" type="number" inputmode="numeric" min="1" placeholder="3" required>
        </div>
        <div class="field small">
          <label for="reps">Reps</label>
          <input id="reps" type="number" inputmode="numeric" min="1" placeholder="12" required>
        </div>
      </div>
      <button type="submit" class="primary">Add Workout</button>
    </form>
  </div>

  <div class="filter-chips" id="filter-chips"></div>

  <section class="list-section">
    <h2>Today <span class="count-badge" id="today-count"></span></h2>
    <ul class="items" id="today-list"></ul>
    <div class="empty-state" id="today-empty" hidden>No workouts yet — add one above.</div>
  </section>

  <section class="list-section">
    <h2>History</h2>
    <div id="history-container"></div>
    <div class="empty-state" id="history-empty" hidden>Completed workouts will show up here.</div>
  </section>
</main>

<script>
(function () {
  const STORAGE_KEY = 'workout-tracker:workouts';

  const CATEGORIES = [
    { id: 'lifting', label: 'Lifting', color: '#33210F' },
    { id: 'ball-handling', label: 'Ball Handling', color: '#5A3A22' },
    { id: 'shooting', label: 'Shooting', color: '#6B3A15' },
    { id: 'conditioning', label: 'Conditioning', color: '#4F4030' },
    { id: 'knee-rehab', label: 'Knee Rehab', color: '#6B3D34' }
  ];
  const DEFAULT_CATEGORY = 'ball-handling';
  const FALLBACK_CATEGORY = 'conditioning';

  // Maps category ids retired in earlier versions of the app to their
  // closest replacement, so workouts already saved in a visitor's
  // localStorage keep a valid category after this rename.
  const CATEGORY_MIGRATIONS = {
    strength: 'lifting',
    cardio: 'conditioning',
    other: 'conditioning'
  };

  function categoryInfo(id) {
    return CATEGORIES.find(c => c.id === id) || CATEGORIES.find(c => c.id === FALLBACK_CATEGORY);
  }

  let activeCategory = 'all';

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      const validIds = new Set(CATEGORIES.map(c => c.id));
      let migrated = false;
      parsed.forEach(w => {
        if (!validIds.has(w.category)) {
          w.category = CATEGORY_MIGRATIONS[w.category] || FALLBACK_CATEGORY;
          migrated = true;
        }
      });
      if (migrated) save(parsed);
      return parsed;
    } catch (e) {
      return [];
    }
  }

  function save(workouts) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(workouts));
    } catch (e) {}
  }

  let workouts = load();

  const form = document.getElementById('add-form');
  const nameInput = document.getElementById('name');
  const categorySelect = document.getElementById('category');
  const setsInput = document.getElementById('sets');
  const repsInput = document.getElementById('reps');

  const filterChips = document.getElementById('filter-chips');
  const todayList = document.getElementById('today-list');
  const todayEmpty = document.getElementById('today-empty');
  const todayCount = document.getElementById('today-count');
  const historyContainer = document.getElementById('history-container');
  const historyEmpty = document.getElementById('history-empty');

  CATEGORIES.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.label;
    categorySelect.appendChild(opt);
  });
  categorySelect.value = DEFAULT_CATEGORY;

  function renderChips() {
    filterChips.innerHTML = '';
    const all = [{ id: 'all', label: 'All' }, ...CATEGORIES];
    all.forEach(c => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (activeCategory === c.id ? ' active' : '');
      chip.textContent = c.label;
      chip.addEventListener('click', () => {
        activeCategory = c.id;
        render();
      });
      filterChips.appendChild(chip);
    });
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function todayKey(date) {
    const d = new Date(date);
    return d.toISOString().slice(0, 10);
  }

  function formatDateLabel(key) {
    const todayK = todayKey(Date.now());
    const yesterdayK = todayKey(Date.now() - 86400000);
    if (key === todayK) return 'Today';
    if (key === yesterdayK) return 'Yesterday';
    const d = new Date(key + 'T00:00:00');
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function render() {
    renderChips();

    const inFilter = w => activeCategory === 'all' || (w.category || DEFAULT_CATEGORY) === activeCategory;

    // Pending (not done) workouts, newest first
    const pending = workouts.filter(w => !w.done && inFilter(w)).sort((a, b) => b.createdAt - a.createdAt);
    todayList.innerHTML = '';
    pending.forEach(w => todayList.appendChild(renderItem(w)));
    todayEmpty.hidden = pending.length > 0;
    todayCount.textContent = pending.length ? `(${pending.length})` : '';

    // Completed workouts, grouped by completion date, newest first
    const done = workouts.filter(w => w.done && inFilter(w)).sort((a, b) => b.completedAt - a.completedAt);
    historyContainer.innerHTML = '';
    historyEmpty.hidden = done.length > 0;

    const groups = new Map();
    done.forEach(w => {
      const key = todayKey(w.completedAt);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(w);
    });

    groups.forEach((items, key) => {
      const label = document.createElement('div');
      label.className = 'history-date';
      label.textContent = formatDateLabel(key);
      historyContainer.appendChild(label);

      const ul = document.createElement('ul');
      ul.className = 'items';
      items.forEach(w => ul.appendChild(renderItem(w)));
      historyContainer.appendChild(ul);
    });
  }

  function renderItem(w) {
    const li = document.createElement('li');
    li.className = 'item' + (w.done ? ' done' : '');

    const check = document.createElement('button');
    check.className = 'check';
    check.type = 'button';
    check.textContent = '✓';
    check.setAttribute('aria-label', w.done ? 'Mark as not done' : 'Mark as done');
    check.addEventListener('click', () => toggleDone(w.id));

    const info = document.createElement('div');
    info.className = 'item-info';
    const nameEl = document.createElement('div');
    nameEl.className = 'item-name';
    nameEl.textContent = w.name;
    const metaEl = document.createElement('div');
    metaEl.className = 'item-meta';
    metaEl.textContent = `${w.sets} sets × ${w.reps} reps`;

    const cat = categoryInfo(w.category || DEFAULT_CATEGORY);
    const badgeEl = document.createElement('div');
    badgeEl.className = 'category-badge';
    badgeEl.textContent = cat.label;
    badgeEl.style.background = cat.color + '26';
    badgeEl.style.color = cat.color;

    info.appendChild(nameEl);
    info.appendChild(metaEl);
    info.appendChild(badgeEl);

    const del = document.createElement('button');
    del.className = 'delete-btn';
    del.type = 'button';
    del.textContent = 'Delete';
    del.addEventListener('click', () => removeWorkout(w.id));

    li.appendChild(check);
    li.appendChild(info);
    li.appendChild(del);
    return li;
  }

  function toggleDone(id) {
    const w = workouts.find(w => w.id === id);
    if (!w) return;
    w.done = !w.done;
    w.completedAt = w.done ? Date.now() : null;
    save(workouts);
    render();
  }

  function removeWorkout(id) {
    workouts = workouts.filter(w => w.id !== id);
    save(workouts);
    render();
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = nameInput.value.trim();
    const category = categorySelect.value || DEFAULT_CATEGORY;
    const sets = parseInt(setsInput.value, 10);
    const reps = parseInt(repsInput.value, 10);
    if (!name || !sets || !reps) return;

    workouts.push({
      id: uid(),
      name,
      category,
      sets,
      reps,
      done: false,
      createdAt: Date.now(),
      completedAt: null
    });
    save(workouts);
    render();
    form.reset();
    categorySelect.value = DEFAULT_CATEGORY;
    nameInput.focus();
  });

  render();
})();
</script>
</body>
</html>
