<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFFFFF">
<title>Shai's Workout Tracker Test App</title>
<style>
  :root {
    color-scheme: light;
    --bg: #FFFFFF;
    --card: #F3EDE6;
    --text: #2E1B0F;
    --text-dim: #5C4130;
    --border: #E4D6C3;
    --accent: #5C4033;
    --accent-text: #FFFFFF;
    --done-bg: #EAD9BE;
    --done-border: #5C4033;
    --danger: #7A2E1E;
    --input-bg: #F3EDE6;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  img { max-width: 100%; }
  [hidden] { display: none !important; }

  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--bg);
    padding: 18px 0 10px;
    z-index: 10;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-top: 2px;
  }

  main {
    max-width: 560px;
    margin: 0 auto;
    padding-bottom: 48px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-top: 16px;
  }

  .cal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }

  .cal-title {
    font-size: 0.95rem;
    font-weight: 700;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cal-streak {
    font-size: 0.62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 7px;
    border-radius: 3px;
    background: var(--done-bg);
    border: 1px solid var(--accent);
    color: var(--accent);
    white-space: nowrap;
  }

  .cal-nav { display: flex; gap: 6px; flex: 0 0 auto; }

  .cal-nav-btn {
    appearance: none;
    width: 32px;
    height: 32px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 6px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
    line-height: 1;
  }

  .cal-nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .cal-dow {
    text-align: center;
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    padding-bottom: 4px;
  }

  .cal-day {
    appearance: none;
    position: relative;
    min-height: 46px;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 6px;
    padding: 4px 2px 3px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 3px;
    font-family: inherit;
    color: var(--text);
  }

  .cal-day.outside { opacity: 0.4; }
  .cal-day.streak { background: var(--done-bg); }

  .cal-day.today {
    border-color: var(--accent);
    border-width: 2px;
    padding: 3px 1px 2px;
  }

  .cal-day.selected {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .cal-num {
    font-size: 0.82rem;
    font-weight: 700;
    line-height: 1;
  }

  .cal-day.today .cal-num { color: var(--accent); }

  .cal-marks {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 2px;
    min-height: 10px;
  }

  .cal-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    display: block;
  }

  .cal-rest {
    width: 11px;
    height: 3px;
    border-radius: 2px;
    background: var(--text-dim);
    display: block;
  }

  .cal-missed {
    font-size: 9px;
    font-weight: 800;
    color: var(--danger);
    line-height: 1;
  }

  .cal-legend {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 12px;
    margin-top: 10px;
    font-size: 0.68rem;
    color: var(--text-dim);
  }

  .cal-legend span { display: inline-flex; align-items: center; gap: 4px; }

  .cal-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .cal-toggle {
    appearance: none;
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-weight: 700;
    font-size: 0.82rem;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
  }

  .cal-detail {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .cal-detail-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }

  .cal-detail-date { font-size: 0.92rem; font-weight: 700; }

  .cal-detail-pir {
    font-size: 0.85rem;
    font-weight: 700;
    white-space: nowrap;
  }

  .cal-detail-pir.up { color: var(--accent); }
  .cal-detail-pir.down { color: var(--danger); }
  .cal-detail-pir.flat { color: var(--text-dim); }

  .cal-detail-status {
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-top: 3px;
    line-height: 1.45;
  }

  .cal-detail-list {
    list-style: none;
    margin: 10px 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .cal-detail-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 9px;
  }

  .cal-detail-item .cal-dot { width: 7px; height: 7px; flex: 0 0 auto; }
  .cal-detail-name { font-weight: 600; flex: 1; min-width: 0; word-break: break-word; }
  .cal-detail-meta { color: var(--text-dim); font-size: 0.76rem; white-space: nowrap; }

  .cal-log {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
  }

  .cal-log-label {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .cal-log-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .cal-log-row > * { flex: 1; min-width: 0; }

  .cal-locked {
    font-size: 0.76rem;
    color: var(--text-dim);
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
    line-height: 1.45;
  }

  .cal-game {
    width: 8px;
    height: 8px;
    background: var(--accent);
    transform: rotate(45deg);
    display: block;
    flex: 0 0 auto;
  }

  .cal-game.scheduled {
    background: transparent;
    border: 1.5px solid var(--accent);
  }

  .cal-games { margin-top: 12px; }

  .cal-game-row {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 10px;
    background: var(--bg);
    margin-bottom: 8px;
  }

  .cal-game-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .cal-game-opponent { font-weight: 700; font-size: 0.88rem; }

  .cal-game-result {
    font-size: 0.62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid var(--border);
    flex: 0 0 auto;
  }

  .cal-game-result.win { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .cal-game-result.loss { color: var(--danger); border-color: var(--danger); }
  .cal-game-result.scheduled { color: var(--text-dim); }

  .cal-game-meta, .cal-game-line {
    font-size: 0.76rem;
    color: var(--text-dim);
    margin-top: 3px;
  }

  .cal-game-line { color: var(--text); font-weight: 600; }

  .cal-game-season {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .cal-game-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

  .cal-mini-btn {
    appearance: none;
    background: var(--bg);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-weight: 700;
    font-size: 0.74rem;
    padding: 6px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
  }

  .cal-mini-btn.danger { border-color: var(--danger); color: var(--danger); }
  .cal-mini-btn.wide { width: 100%; padding: 9px; font-size: 0.8rem; }

  .game-controls { display: flex; gap: 8px; }
  .game-controls select { flex: 1; min-width: 0; }

  .game-season-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .game-season-active { font-size: 0.74rem; color: var(--text-dim); }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 8px;
  }

  .stat-tile {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 3px;
    text-align: center;
    min-width: 0;
  }

  .stat-tile-value { font-size: 0.95rem; font-weight: 700; }

  .stat-tile-label {
    font-size: 0.58rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .game-entry {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    margin-bottom: 8px;
    overflow: hidden;
  }

  .game-entry-head {
    appearance: none;
    width: 100%;
    background: none;
    border: none;
    font-family: inherit;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px;
    cursor: pointer;
    text-align: left;
  }

  .game-entry-left { min-width: 0; flex: 1; }
  .game-entry-title { font-weight: 700; font-size: 0.88rem; word-break: break-word; }
  .game-entry-meta { font-size: 0.72rem; color: var(--text-dim); margin-top: 2px; }

  .game-entry-right {
    flex: 0 0 auto;
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }

  .game-entry-pts { font-weight: 800; font-size: 0.95rem; }
  .game-entry-line { font-size: 0.72rem; color: var(--text-dim); }

  .game-high-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 0 10px 8px;
  }

  .game-high-tag {
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 6px;
    border-radius: 3px;
    background: var(--done-bg);
    border: 1px solid var(--accent);
    color: var(--accent);
  }

  .box-score {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    padding: 0 10px 8px;
  }

  .box-cell {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 2px;
    text-align: center;
    min-width: 0;
  }

  .box-cell-value { font-size: 0.85rem; font-weight: 700; }

  .box-cell-label {
    font-size: 0.52rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--text-dim);
    margin-top: 1px;
  }

  .game-entry .stat-grid, .game-entry .cal-game-actions { padding: 0 10px 10px; margin-bottom: 0; }

  .stat-form {
    border-top: 1px solid var(--border);
    padding: 12px 10px;
    background: var(--card);
  }

  .stat-input-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-bottom: 10px;
  }

  .stat-input { min-width: 0; }

  .stat-input label {
    font-size: 0.58rem;
    letter-spacing: 0.04em;
    margin-bottom: 2px;
  }

  .stat-input input { padding: 8px 4px; text-align: center; font-weight: 700; background: var(--bg); }

  .stat-input-caption {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
  }

  .result-row { display: flex; align-items: center; gap: 8px; margin: 10px 0; }

  .result-btn {
    appearance: none;
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-weight: 700;
    font-size: 0.82rem;
    padding: 9px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }

  .result-btn.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

  .stat-error {
    color: var(--danger);
    font-size: 0.76rem;
    font-weight: 600;
    min-height: 1em;
    margin-bottom: 6px;
  }

  .pir-card {
    text-align: center;
  }

  .pir-label {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .pir-score {
    font-size: 3rem;
    font-weight: 800;
    line-height: 1.1;
    margin: 4px 0 2px;
    font-variant-numeric: proportional-nums;
  }

  .pir-stats {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 10px 0 4px;
  }

  .pir-stat {
    flex: 1;
    max-width: 140px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 6px;
  }

  .pir-stat-value {
    font-size: 1.15rem;
    font-weight: 700;
  }

  .pir-stat-label {
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-top: 2px;
  }

  .pir-chart-wrap {
    position: relative;
    margin-top: 14px;
    text-align: left;
  }

  .pir-chart-wrap svg {
    display: block;
    width: 100%;
    height: auto;
    touch-action: pan-y;
  }

  .pir-chart-empty {
    color: var(--text-dim);
    font-size: 0.82rem;
    text-align: center;
    padding: 20px 8px;
  }

  .chart-tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--text);
    color: var(--bg);
    font-size: 0.72rem;
    font-weight: 600;
    padding: 4px 7px;
    border-radius: 4px;
    white-space: nowrap;
    transform: translate(-50%, -100%);
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 5;
  }

  .chart-tooltip.visible { opacity: 1; }

  .chart-tooltip .tt-value { font-weight: 800; }

  .rest-day-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .rest-day-btn {
    appearance: none;
    background: var(--bg);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-weight: 700;
    font-size: 0.82rem;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
  }

  .rest-day-btn.active {
    background: var(--accent);
    color: var(--accent-text);
  }

  .rest-day-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .rest-day-status {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-align: right;
  }

  .add-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .add-form .row {
    display: flex;
    gap: 10px;
  }

  label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 4px;
    display: block;
  }

  input, select {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 11px 12px;
    font-size: 16px;
    color: var(--text);
    font-family: inherit;
  }

  select {
    appearance: none;
    -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 13px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }

  input:focus, select:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }

  .field { flex: 1; min-width: 0; }
  .field.small { flex: 0 0 30%; }

  button.primary {
    appearance: none;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 700;
    font-size: 16px;
    padding: 13px;
    border-radius: 6px;
    width: 100%;
    margin-top: 2px;
    cursor: pointer;
  }

  button.primary:active { opacity: 0.75; }

  section.list-section {
    margin-top: 28px;
  }

  h2 {
    font-size: 1.05rem;
    font-weight: 700;
    margin: 0 0 10px;
  }

  .count-badge {
    color: var(--text-dim);
    font-weight: 500;
    font-size: 0.85rem;
  }

  ul.items {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  li.item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  li.item.done {
    background: var(--done-bg);
    border-color: var(--done-border);
  }

  .check {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 4px;
    border: 2px solid var(--text-dim);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: transparent;
    font-size: 16px;
    font-weight: 800;
    padding: 0;
  }

  li.item.done .check {
    border-color: var(--done-border);
    background: var(--done-border);
    color: #ffffff;
  }

  .item-info { flex: 1; min-width: 0; }

  .item-name {
    font-weight: 600;
    font-size: 1rem;
    word-break: break-word;
  }

  li.item.done .item-name {
    text-decoration: line-through;
    color: var(--text-dim);
  }

  .item-meta {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-top: 2px;
  }

  .category-badge {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 7px;
    border-radius: 3px;
    margin-top: 6px;
  }

  .filter-chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 2px;
    margin: 14px 0 -4px;
    -webkit-overflow-scrolling: touch;
  }

  .filter-chips::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.82rem;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 5px;
    cursor: pointer;
  }

  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }

  .delete-btn {
    flex: 0 0 auto;
    background: transparent;
    border: none;
    color: var(--danger);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 6px 4px;
    cursor: pointer;
  }

  .empty-state {
    color: var(--text-dim);
    font-size: 0.9rem;
    text-align: center;
    padding: 24px 8px;
  }

  .history-date {
    color: var(--text-dim);
    font-size: 0.75rem;

<body>
<header>
  <main style="padding-bottom:0;">
    <h1>Shai's Workout Tracker Test App</h1>
    <div class="subtitle">Track sets, reps, and completed workouts.</div>
  </main>

<main>
  <div class="card" id="calendar-card"></div>

  <div class="card pir-card">
    <div class="pir-label">Projected Improvement Rating</div>
    <div class="pir-score" id="pir-score">0</div>
    <div class="pir-stats">
      <div class="pir-stat">
        <div class="pir-stat-value" id="pir-multiplier">1.0x</div>
        <div class="pir-stat-label">Multiplier</div>
      </div>
      <div class="pir-stat">
        <div class="pir-stat-value" id="pir-streak">0</div>
        <div class="pir-stat-label">Day streak</div>
      </div>
    </div>
    <div class="pir-chart-wrap" id="pir-chart-wrap"></div>
    <div class="rest-day-row">
      <button type="button" class="rest-day-btn" id="rest-day-btn">Mark today as rest day</button>
      <div class="rest-day-status" id="rest-day-status"></div>
    </div>
  </div>

  <div class="card">
    <form class="add-form" id="add-form">
      <div class="field">

        <input id="name" type="text" placeholder="e.g. Push ups" autocomplete="off" required>
      </div>
      <div class="field">

        <select id="category"></select>
      </div>
      <div class="row">
        <div class="field small">
          <label for="sets">Sets</label>

        </div>

          <input id="reps" type="number" inputmode="numeric" min="1" placeholder="12" required>
        </div>

      <button type="submit" class="primary">Add Workout</button>
    </form>
  </div>

  <div class="filter-chips" id="filter-chips"></div>

    <ul class="items" id="today-list"></ul>
    <div class="empty-state" id="today-empty" hidden>No workouts yet — add one above.</div>
  </section>

  </section>
</main>

<script>
(function () {
  const STORAGE_KEY = 'workout-tracker:workouts';
  const REST_DAYS_KEY = 'workout-tracker:rest-days';
  const MAX_REST_DAYS_PER_WEEK = 2;

  const CATEGORIES = [
    { id: 'lifting', label: 'Lifting', color: '#33210F' },
    { id: 'ball-handling', label: 'Ball Handling', color: '#5A3A22' },
    { id: 'shooting', label: 'Shooting', color: '#6B3A15' },
    { id: 'conditioning', label: 'Conditioning', color: '#4F4030' },
    { id: 'knee-rehab', label: 'Knee Rehab', color: '#6B3D34' }
  ];
  const DEFAULT_CATEGORY = 'ball-handling';
  const FALLBACK_CATEGORY = 'conditioning';

  // Maps category ids retired in earlier versions of the app to their
  // closest replacement, so workouts already saved in a visitor's
  // localStorage keep a valid category after this rename.
  const CATEGORY_MIGRATIONS = {
    strength: 'lifting',
    cardio: 'conditioning',
    other: 'conditioning'
  };

  function categoryInfo(id) {
    return CATEGORIES.find(c => c.id === id) || CATEGORIES.find(c => c.id === FALLBACK_CATEGORY);
  }

  let activeCategory = 'all';

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      const validIds = new Set(CATEGORIES.map(c => c.id));
      let migrated = false;
      parsed.forEach(w => {
        if (!validIds.has(w.category)) {
          w.category = CATEGORY_MIGRATIONS[w.category] || FALLBACK_CATEGORY;
          migrated = true;
        }
      });
      if (migrated) save(parsed);
      return parsed;
    } catch (e) {
      return [];
    }
  }

  function save(workouts) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(workouts));
    } catch (e) {}
  }

  function loadRestDays() {
    try {
      const raw = localStorage.getItem(REST_DAYS_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveRestDays(restDays) {
    try {
      localStorage.setItem(REST_DAYS_KEY, JSON.stringify(restDays));
    } catch (e) {}
  }

  let workouts = load();

  const form = document.getElementById('add-form');
  const nameInput = document.getElementById('name');
  const categorySelect = document.getElementById('category');
  const setsInput = document.getElementById('sets');
  const repsInput = document.getElementById('reps');

  const filterChips = document.getElementById('filter-chips');
  const todayList = document.getElementById('today-list');
  const todayEmpty = document.getElementById('today-empty');
  const todayCount = document.getElementById('today-count');
  const historyContainer = document.getElementById('history-container');
  const historyEmpty = document.getElementById('history-empty');

  const pirScoreEl = document.getElementById('pir-score');
  const pirMultiplierEl = document.getElementById('pir-multiplier');
  const pirStreakEl = document.getElementById('pir-streak');
  const pirChartWrap = document.getElementById('pir-chart-wrap');
  const restDayBtn = document.getElementById('rest-day-btn');
  const restDayStatus = document.getElementById('rest-day-status');
  const skillTestCard = document.getElementById('skill-test-card');
  const calendarCard = document.getElementById('calendar-card');
  const gamesCard = document.getElementById('games-card');

  CATEGORIES.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.label;
    categorySelect.appendChild(opt);
  });
  categorySelect.value = DEFAULT_CATEGORY;

  function renderChips() {
    filterChips.innerHTML = '';
    const all = [{ id: 'all', label: 'All' }, ...CATEGORIES];
    all.forEach(c => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (activeCategory === c.id ? ' active' : '');
      chip.textContent = c.label;
      chip.addEventListener('click', () => {
        activeCategory = c.id;
        render();
      });
      filterChips.appendChild(chip);
    });
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function todayKey(date) {
    const d = new Date(date);
    return d.toISOString().slice(0, 10);
  }

  function formatDateLabel(key) {
    const todayK = todayKey(Date.now());
    const yesterdayK = todayKey(Date.now() - 86400000);
    if (key === todayK) return 'Today';
    if (key === yesterdayK) return 'Yesterday';
    const d = new Date(key + 'T00:00:00');
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function keyToEpochDay(key) {
    return Math.floor(Date.parse(key + 'T00:00:00Z') / 86400000);
  }

  function epochDayToKey(epochDay) {
    return new Date(epochDay * 86400000).toISOString().slice(0, 10);
  }

  // Monday-anchored week identifier (an epoch day number), used to cap
  // rest days at 2 per week regardless of which day the week starts on.
  function weekKeyOf(dateKey) {
    const epochDay = keyToEpochDay(dateKey);
    const dow = new Date(epochDay * 86400000).getUTCDay(); // 0=Sun..6=Sat
    const diffToMonday = (dow + 6) % 7;
    return epochDay - diffToMonday;
  }

  // Replays every day from the first logged activity through today,
  // deriving the PIR score, multiplier, and streak purely from completed
  // workouts and marked rest days rather than persisting a running total.
  function computePIR() {
    const today = todayKey(Date.now());
    const trainingCounts = new Map();
    workouts.forEach(w => {
      if (w.done && w.completedAt) {
        const key = todayKey(w.completedAt);
        trainingCounts.set(key, (trainingCounts.get(key) || 0) + 1);
      }
    });

    // A played game counts as a training day exactly like a workout. Games
    // that are only scheduled (no box score yet) never count, so marking
    // future days can't be used to shield a streak.
    const todayEpoch = keyToEpochDay(today);
    loadGames().forEach(game => {
      if (game.played && game.stats && keyToEpochDay(game.date) <= todayEpoch) {
        trainingCounts.set(game.date, (trainingCounts.get(game.date) || 0) + 1);
      }
    });

    const restDays = loadRestDays();
    const restDaySet = new Set(restDays);
    const restDaysUsedThisWeek = restDays.filter(d => weekKeyOf(d) === weekKeyOf(today)).length;

    const activeDates = [...trainingCounts.keys(), ...restDaySet];
    if (activeDates.length === 0) {
      return {
        score: 0,
        multiplier: 1.0,
        streak: 0,
        history: [],
        historyByDate: new Map(),
        streakDates: new Set(),
        trainingCounts,
        today,
        restDaysUsedThisWeek,
        isTodayRest: restDaySet.has(today),
        isTodayTraining: false
      };
    }

    const firstDay = activeDates.reduce((a, b) => (a < b ? a : b));
    const firstEpochDay = keyToEpochDay(firstDay);
    const todayEpochDay = keyToEpochDay(today);

    let score = 0;
    let streakCount = 0;
    const history = [];

    for (let epochDay = firstEpochDay; epochDay <= todayEpochDay; epochDay++) {
      const dKey = epochDayToKey(epochDay);
      const isToday = dKey === today;
      const workoutsToday = trainingCounts.get(dKey) || 0;

      const scoreBefore = score;

      if (workoutsToday > 0) {
        streakCount += 1;
        const step = Math.min(streakCount - 1, 10);
        const multiplier = (10 + step) / 10;
        const pointsDelta = (10 + step) * workoutsToday;
        score = Math.max(0, score + pointsDelta);
        history.push({ date: dKey, score, event: 'workout', multiplier, delta: score - scoreBefore, workouts: workoutsToday });
      } else if (restDaySet.has(dKey)) {
        const step = streakCount > 0 ? Math.min(streakCount - 1, 10) : 0;
        const multiplier = streakCount > 0 ? (10 + step) / 10 : 1.0;
        history.push({ date: dKey, score, event: 'rest', multiplier, delta: 0, workouts: 0 });
      } else if (isToday) {
        // Today isn't over yet — don't penalize until it's actually missed.
        break;
      } else {
        streakCount = 0;
        score = Math.max(0, score - 15);
        history.push({ date: dKey, score, event: 'missed', multiplier: 1.0, delta: score - scoreBefore, workouts: 0 });
      }
    }

    const finalStep = streakCount > 0 ? Math.min(streakCount - 1, 10) : 0;
    const multiplier = streakCount > 0 ? (10 + finalStep) / 10 : 1.0;

    const historyByDate = new Map();
    history.forEach(entry => historyByDate.set(entry.date, entry));

    // The trailing run of workout/rest days with no miss — the days the
    // calendar highlights as the live streak.
    const streakDates = new Set();
    for (let i = history.length - 1; i >= 0; i--) {
      if (history[i].event === 'missed') break;
      streakDates.add(history[i].date);
    }

    return {
      score,
      multiplier,
      streak: streakCount,
      history,
      historyByDate,
      streakDates,
      trainingCounts,
      today,
      restDaysUsedThisWeek,
      isTodayRest: restDaySet.has(today),
      isTodayTraining: (trainingCounts.get(today) || 0) > 0
    };
  }

  function toggleRestDay() {
    const today = todayKey(Date.now());
    let restDays = loadRestDays();
    if (restDays.includes(today)) {
      restDays = restDays.filter(d => d !== today);
    } else {
      const usedThisWeek = restDays.filter(d => weekKeyOf(d) === weekKeyOf(today)).length;
      if (usedThisWeek >= MAX_REST_DAYS_PER_WEEK) return;
      restDays.push(today);
    }
    saveRestDays(restDays);
    render();
  }

  const rootStyle = getComputedStyle(document.documentElement);
  function cssVar(name) {
    return rootStyle.getPropertyValue(name).trim();
  }

  function renderChart(history) {
    pirChartWrap.innerHTML = '';

    if (history.length < 2) {
      const empty = document.createElement('div');
      empty.className = 'pir-chart-empty';
      empty.textContent = history.length === 0
        ? 'Complete a workout to start tracking PIR over time.'
        : 'Keep logging workouts to see your PIR trend.';
      pirChartWrap.appendChild(empty);
      return;
    }

    const width = 320;
    const height = 130;
    const padLeft = 34;
    const padRight = 8;
    const padTop = 10;
    const padBottom = 20;
    const plotW = width - padLeft - padRight;
    const plotH = height - padTop - padBottom;

    const scores = history.map(h => h.score);
    const maxScore = Math.max(...scores, 10);
    const minScore = 0;

    const xAt = i => padLeft + (history.length === 1 ? 0 : (i / (history.length - 1)) * plotW);
    const yAt = v => padTop + plotH - ((v - minScore) / (maxScore - minScore)) * plotH;

    const points = history.map((h, i) => [xAt(i), yAt(h.score)]);
    const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    const areaPath = `${linePath} L${points[points.length - 1][0].toFixed(1)},${(padTop + plotH).toFixed(1)} L${points[0][0].toFixed(1)},${(padTop + plotH).toFixed(1)} Z`;

    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', `PIR trend from ${history[0].score} to ${history[history.length - 1].score} points over ${history.length} days`);

    // Gridlines + axis labels (baseline and max)
    [minScore, maxScore].forEach(v => {
      const y = yAt(v);
      const line = document.createElementNS(svgNS, 'line');
      line.setAttribute('x1', padLeft);
      line.setAttribute('x2', width - padRight);
      line.setAttribute('y1', y.toFixed(1));
      line.setAttribute('y2', y.toFixed(1));
      line.setAttribute('stroke', cssVar('--border'));
      line.setAttribute('stroke-width', '1');
      svg.appendChild(line);

      const label = document.createElementNS(svgNS, 'text');
      label.setAttribute('x', padLeft - 6);
      label.setAttribute('y', (y + 3).toFixed(1));
      label.setAttribute('text-anchor', 'end');
      label.setAttribute('font-size', '9');
      label.setAttribute('fill', cssVar('--text-dim'));
      label.textContent = Math.round(v);
      svg.appendChild(label);
    });

    // X-axis date labels: first and last day only, to stay legible on iPhone widths
    [0, history.length - 1].forEach(i => {
      if (i === 0 && history.length === 1) return;
      const label = document.createElementNS(svgNS, 'text');
      label.setAttribute('x', points[i][0].toFixed(1));
      label.setAttribute('y', height - 4);
      label.setAttribute('text-anchor', i === 0 ? 'start' : 'end');
      label.setAttribute('font-size', '9');
      label.setAttribute('fill', cssVar('--text-dim'));
      const d = new Date(history[i].date + 'T00:00:00Z');
      label.textContent = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' });
      svg.appendChild(label);
    });

    const area = document.createElementNS(svgNS, 'path');
    area.setAttribute('d', areaPath);
    area.setAttribute('fill', cssVar('--accent'));
    area.setAttribute('fill-opacity', '0.1');
    area.setAttribute('stroke', 'none');
    svg.appendChild(area);

    const line = document.createElementNS(svgNS, 'path');
    line.setAttribute('d', linePath);
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', cssVar('--accent'));
    line.setAttribute('stroke-width', '2');
    line.setAttribute('stroke-linecap', 'round');
    line.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(line);

    const lastPoint = points[points.length - 1];
    const endDot = document.createElementNS(svgNS, 'circle');
    endDot.setAttribute('cx', lastPoint[0].toFixed(1));
    endDot.setAttribute('cy', lastPoint[1].toFixed(1));
    endDot.setAttribute('r', '5');
    endDot.setAttribute('fill', cssVar('--accent'));
    endDot.setAttribute('stroke', cssVar('--card'));
    endDot.setAttribute('stroke-width', '2');
    svg.appendChild(endDot);

    // Crosshair + hover/tap dot, hidden until the reader interacts
    const crosshair = document.createElementNS(svgNS, 'line');
    crosshair.setAttribute('y1', padTop);
    crosshair.setAttribute('y2', padTop + plotH);
    crosshair.setAttribute('stroke', cssVar('--text-dim'));
    crosshair.setAttribute('stroke-width', '1');
    crosshair.setAttribute('opacity', '0');
    svg.appendChild(crosshair);

    const hoverDot = document.createElementNS(svgNS, 'circle');
    hoverDot.setAttribute('r', '5');
    hoverDot.setAttribute('fill', cssVar('--accent'));
    hoverDot.setAttribute('stroke', cssVar('--card'));
    hoverDot.setAttribute('stroke-width', '2');
    hoverDot.setAttribute('opacity', '0');
    svg.appendChild(hoverDot);

    const hitArea = document.createElementNS(svgNS, 'rect');
    hitArea.setAttribute('x', padLeft);
    hitArea.setAttribute('y', 0);
    hitArea.setAttribute('width', plotW);
    hitArea.setAttribute('height', height);
    hitArea.setAttribute('fill', 'transparent');
    svg.appendChild(hitArea);

    const tooltip = document.createElement('div');
    tooltip.className = 'chart-tooltip';
    pirChartWrap.appendChild(svg);
    pirChartWrap.appendChild(tooltip);

    function showAt(clientX) {
      const rect = svg.getBoundingClientRect();
      const relX = ((clientX - rect.left) / rect.width) * width;
      let nearest = 0;
      let nearestDist = Infinity;
      points.forEach((p, i) => {
        const dist = Math.abs(p[0] - relX);
        if (dist < nearestDist) {
          nearestDist = dist;
          nearest = i;
        }
      });

      const [px, py] = points[nearest];
      crosshair.setAttribute('x1', px.toFixed(1));
      crosshair.setAttribute('x2', px.toFixed(1));
      crosshair.setAttribute('opacity', '1');
      hoverDot.setAttribute('cx', px.toFixed(1));
      hoverDot.setAttribute('cy', py.toFixed(1));
      hoverDot.setAttribute('opacity', '1');

      const entry = history[nearest];
      const d = new Date(entry.date + 'T00:00:00Z');
      const dateLabel = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' });
      tooltip.innerHTML = '';
      const valueSpan = document.createElement('span');
      valueSpan.className = 'tt-value';
      valueSpan.textContent = entry.score;
      tooltip.appendChild(valueSpan);
      tooltip.appendChild(document.createTextNode(' PIR — '));
      tooltip.appendChild(document.createTextNode(dateLabel));

      const pctX = (px / width) * 100;
      const pctY = (py / height) * 100;
      tooltip.style.left = pctX + '%';
      tooltip.style.top = pctY + '%';
      tooltip.classList.add('visible');
    }

    function hide() {
      crosshair.setAttribute('opacity', '0');
      hoverDot.setAttribute('opacity', '0');
      tooltip.classList.remove('visible');
    }

    hitArea.addEventListener('pointermove', e => showAt(e.clientX));
    hitArea.addEventListener('pointerdown', e => showAt(e.clientX));
    hitArea.addEventListener('pointerleave', hide);
  }

  function renderPIR(pir) {

    pirScoreEl.textContent = pir.score;
    pirMultiplierEl.textContent = pir.multiplier.toFixed(1) + 'x';
    pirStreakEl.textContent = pir.streak;

    renderChart(pir.history);

    const capReached = pir.restDaysUsedThisWeek >= MAX_REST_DAYS_PER_WEEK;
    restDayBtn.classList.toggle('active', pir.isTodayRest);
    if (pir.isTodayTraining) {
      restDayBtn.textContent = 'Workout already logged today';
      restDayBtn.disabled = true;
    } else if (pir.isTodayRest) {
      restDayBtn.textContent = 'Unmark today as rest day';
      restDayBtn.disabled = false;
    } else if (capReached) {
      restDayBtn.textContent = 'Rest day cap reached';
      restDayBtn.disabled = true;
    } else {
      restDayBtn.textContent = 'Mark today as rest day';
      restDayBtn.disabled = false;
    }
    restDayStatus.textContent = `${pir.restDaysUsedThisWeek}/${MAX_REST_DAYS_PER_WEEK} rest days used this week`;
  }

  // ---------- Games ----------

  const GAMES_KEY = 'workout-tracker:games';
  const SEASONS_KEY = 'workout-tracker:seasons';
  const ACTIVE_SEASON_KEY = 'workout-tracker:active-season';

  const GAME_TYPES = [
    { id: 'league', label: 'League game', short: 'League' },
    { id: 'tournament', label: 'Tournament', short: 'Tourney' },
    { id: 'pickup', label: 'Pickup', short: 'Pickup' },
    { id: 'scrimmage', label: 'Scrimmage', short: 'Scrimmage' }
  ];

  const STAT_FIELDS = [
    { id: 'min', label: 'Minutes', short: 'MIN' },
    { id: 'pts', label: 'Points', short: 'PTS' },
    { id: 'fgm', label: 'FG made', short: 'FGM' },
    { id: 'fga', label: 'FG att', short: 'FGA' },
    { id: 'tpm', label: '3PT made', short: '3PM' },
    { id: 'tpa', label: '3PT att', short: '3PA' },
    { id: 'ftm', label: 'FT made', short: 'FTM' },
    { id: 'fta', label: 'FT att', short: 'FTA' },
    { id: 'oreb', label: 'Off reb', short: 'OREB' },
    { id: 'dreb', label: 'Def reb', short: 'DREB' },
    { id: 'ast', label: 'Assists', short: 'AST' },
    { id: 'stl', label: 'Steals', short: 'STL' },
    { id: 'blk', label: 'Blocks', short: 'BLK' },
    { id: 'tov', label: 'Turnovers', short: 'TOV' },
    { id: 'pf', label: 'Fouls', short: 'PF' }
  ];

  // Pairs that must satisfy made <= attempted before a box score saves.
  const MADE_ATTEMPT_PAIRS = [['fgm', 'fga', 'field goals'], ['tpm', 'tpa', 'three-pointers'], ['ftm', 'fta', 'free throws']];

  const HIGH_STATS = [
    { id: 'pts', label: 'Points' },
    { id: 'reb', label: 'Rebounds' },
    { id: 'ast', label: 'Assists' },
    { id: 'stl', label: 'Steals' },
    { id: 'blk', label: 'Blocks' }
  ];

  let gameSeasonFilter = 'all';
  let gameTypeFilter = 'all';
  let editingGameId = null;
  let markingGameDay = null;
  const expandedGames = new Set();

  function loadGames() {
    try {
      const raw = localStorage.getItem(GAMES_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function saveGames(games) {
    try {
      localStorage.setItem(GAMES_KEY, JSON.stringify(games));
    } catch (e) {}
  }

  function loadSeasons() {
    try {
      const raw = localStorage.getItem(SEASONS_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function saveSeasons(seasons) {
    try {
      localStorage.setItem(SEASONS_KEY, JSON.stringify(seasons));
    } catch (e) {}
  }

  function saveActiveSeasonId(id) {
    try {
      localStorage.setItem(ACTIVE_SEASON_KEY, id);
    } catch (e) {}
  }

  function loadActiveSeasonId() {
    try {
      return localStorage.getItem(ACTIVE_SEASON_KEY);
    } catch (e) {
      return null;
    }
  }

  function ensureActiveSeason() {
    let seasons = loadSeasons();
    if (!seasons.length) {
      const season = {
        id: uid(),
        name: new Date(Date.now()).getUTCFullYear() + ' Season',
        startedAt: Date.now()
      };
      seasons = [season];
      saveSeasons(seasons);
      saveActiveSeasonId(season.id);
      return season;
    }
    const activeId = loadActiveSeasonId();
    return seasons.find(s => s.id === activeId) || seasons[seasons.length - 1];
  }

  function seasonName(id) {
    const season = loadSeasons().find(s => s.id === id);
    return season ? season.name : 'Unassigned';
  }

  function gameTypeLabel(id, short) {
    const type = GAME_TYPES.find(t => t.id === id);
    if (!type) return id;
    return short ? type.short : type.label;
  }

  function pctOf(made, attempted) {
    return attempted > 0 ? (made / attempted) * 100 : null;
  }

  // TS% = points / (2 * (FGA + 0.44 * FTA))
  function trueShootingPct(points, fga, fta) {
    const denominator = 2 * (fga + 0.44 * fta);
    return denominator > 0 ? (points / denominator) * 100 : null;
  }

  function gameRebounds(stats) {
    return (stats.oreb || 0) + (stats.dreb || 0);
  }

  function gamePercentages(stats) {
    return {
      fg: pctOf(stats.fgm || 0, stats.fga || 0),
      tp: pctOf(stats.tpm || 0, stats.tpa || 0),
      ft: pctOf(stats.ftm || 0, stats.fta || 0),
      ts: trueShootingPct(stats.pts || 0, stats.fga || 0, stats.fta || 0)
    };
  }

  function gamesOnDay(dateKey) {
    return loadGames().filter(g => g.date === dateKey);
  }

  function playedGamesOf(games) {
    return games.filter(g => g.played && g.stats);
  }

  function filteredGames() {
    return loadGames()
      .filter(g => gameSeasonFilter === 'all' || g.seasonId === gameSeasonFilter)
      .filter(g => gameTypeFilter === 'all' || g.type === gameTypeFilter)
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  }

  // Season percentages come from summed totals, never from averaging the
  // per-game percentages, which would weight a 1-for-2 night like a 9-for-18.
  function aggregateGames(games) {
    const played = playedGamesOf(games);
    if (!played.length) return null;

    const totals = {};
    STAT_FIELDS.forEach(field => { totals[field.id] = 0; });
    let wins = 0;
    let losses = 0;

    played.forEach(game => {
      STAT_FIELDS.forEach(field => { totals[field.id] += game.stats[field.id] || 0; });
      if (game.result === 'win') wins += 1;
      else if (game.result === 'loss') losses += 1;
    });

    const count = played.length;
    return {
      games: count,
      wins,
      losses,
      totals,
      per: {
        pts: totals.pts / count,
        reb: (totals.oreb + totals.dreb) / count,
        ast: totals.ast / count,
        stl: totals.stl / count,
        blk: totals.blk / count,
        tov: totals.tov / count,
        min: totals.min / count
      },
      pcts: {
        fg: pctOf(totals.fgm, totals.fga),
        tp: pctOf(totals.tpm, totals.tpa),
        ft: pctOf(totals.ftm, totals.fta),
        ts: trueShootingPct(totals.pts, totals.fga, totals.fta)
      }
    };
  }

  function seasonHighs(games) {
    const played = playedGamesOf(games);
    const highs = {};
    HIGH_STATS.forEach(stat => {
      let best = null;
      played.forEach(game => {
        const value = stat.id === 'reb' ? gameRebounds(game.stats) : (game.stats[stat.id] || 0);
        if (!best || value > best.value) best = { value, game };
      });
      if (best && best.value > 0) highs[stat.id] = best;
    });
    return highs;
  }

  function formatStatAvg(value) {
    return value === null || value === undefined ? '—' : value.toFixed(1);
  }

  function formatPctStat(value) {
    return value === null || value === undefined ? '—' : value.toFixed(1) + '%';
  }

  // ---------- Calendar ----------

  const DOW_LABELS = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  const BACKFILL_DAYS = 1; // today and yesterday only

  let calendarMode = 'week';
  let calendarAnchor = null;
  let selectedDay = null;

  function keyToNoonTs(key) {
    return Date.parse(key + 'T12:00:00Z');
  }

  function addDaysToKey(key, days) {
    return epochDayToKey(keyToEpochDay(key) + days);
  }

  function addMonthsToKey(key, months) {
    const year = parseInt(key.slice(0, 4), 10);
    const month = parseInt(key.slice(5, 7), 10) - 1 + months;
    const target = new Date(Date.UTC(year, month, 1));
    return target.toISOString().slice(0, 10);
  }

  function formatMonthTitle(key) {
    return new Date(key + 'T00:00:00Z')
      .toLocaleDateString(undefined, { month: 'long', year: 'numeric', timeZone: 'UTC' });
  }

  function formatDayTitle(key) {
    return new Date(key + 'T00:00:00Z')
      .toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric', timeZone: 'UTC' });
  }

  function calendarDays(anchorKey) {
    if (calendarMode === 'week') {
      const monday = weekKeyOf(anchorKey);
      return Array.from({ length: 7 }, (_, i) => ({ key: epochDayToKey(monday + i), outside: false }));
    }
    const monthStart = anchorKey.slice(0, 7) + '-01';
    const monthIndex = monthStart.slice(0, 7);
    const gridStart = weekKeyOf(monthStart);
    const monthEndEpoch = keyToEpochDay(addMonthsToKey(monthStart, 1)) - 1;
    const cells = [];
    let epochDay = gridStart;
    while (epochDay <= monthEndEpoch || cells.length % 7 !== 0) {
      const key = epochDayToKey(epochDay);
      cells.push({ key, outside: key.slice(0, 7) !== monthIndex });
      epochDay += 1;
      if (cells.length > 41) break;
    }
    return cells;
  }

  // Backfilling older days would let a missed day be erased after the
  // fact, so completed workouts can only be logged for today or yesterday.
  function canLogFor(dateKey, todayKey_) {
    const diff = keyToEpochDay(todayKey_) - keyToEpochDay(dateKey);
    return diff >= 0 && diff <= BACKFILL_DAYS;
  }

  function workoutsOnDay(dateKey) {
    return workouts
      .filter(w => w.done && w.completedAt && todayKey(w.completedAt) === dateKey)
      .sort((a, b) => a.completedAt - b.completedAt);
  }

  function dayCategories(dateKey) {
    const present = new Set(workoutsOnDay(dateKey).map(w => w.category || DEFAULT_CATEGORY));
    return CATEGORIES.filter(c => present.has(c.id));
  }

  function renderCalendar(pir) {
    calendarCard.innerHTML = '';
    const today = pir.today;
    const anchor = calendarAnchor || today;

    const head = el('div', 'cal-head');
    const title = el('div', 'cal-title');
    if (calendarMode === 'week') {
      const days = calendarDays(anchor);
      const first = days[0].key;
      const last = days[6].key;
      const sameMonth = first.slice(0, 7) === last.slice(0, 7);
      const fmt = (key, withMonth) => new Date(key + 'T00:00:00Z').toLocaleDateString(undefined,
        withMonth ? { month: 'short', day: 'numeric', timeZone: 'UTC' } : { day: 'numeric', timeZone: 'UTC' });
      title.textContent = fmt(first, true) + ' – ' + fmt(last, !sameMonth);
    } else {
      title.textContent = formatMonthTitle(anchor);
    }
    head.appendChild(title);

    if (pir.streak > 0) {
      head.appendChild(el('span', 'cal-streak', pir.streak + '-day streak'));
    }

    const nav = el('div', 'cal-nav');
    const prev = el('button', 'cal-nav-btn', '‹');
    prev.type = 'button';
    prev.id = 'cal-prev';
    prev.setAttribute('aria-label', 'Previous ' + calendarMode);
    prev.addEventListener('click', () => {
      calendarAnchor = calendarMode === 'week' ? addDaysToKey(anchor, -7) : addMonthsToKey(anchor, -1);
      render();
    });
    const next = el('button', 'cal-nav-btn', '›');
    next.type = 'button';
    next.id = 'cal-next';
    next.setAttribute('aria-label', 'Next ' + calendarMode);
    const nextAnchor = calendarMode === 'week' ? addDaysToKey(anchor, 7) : addMonthsToKey(anchor, 1);
    const nextStartEpoch = calendarMode === 'week' ? weekKeyOf(nextAnchor) : keyToEpochDay(nextAnchor);
    next.disabled = nextStartEpoch > keyToEpochDay(today);
    next.addEventListener('click', () => {
      calendarAnchor = nextAnchor;
      render();
    });
    nav.appendChild(prev);
    nav.appendChild(next);
    head.appendChild(nav);
    calendarCard.appendChild(head);

    const grid = el('div', 'cal-grid');
    DOW_LABELS.forEach(label => grid.appendChild(el('div', 'cal-dow', label)));

    calendarDays(anchor).forEach(cell => {
      const entry = pir.historyByDate.get(cell.key);
      const isToday = cell.key === today;
      const isFuture = keyToEpochDay(cell.key) > keyToEpochDay(today);

      const classes = ['cal-day'];
      if (cell.outside) classes.push('outside');
      if (pir.streakDates.has(cell.key)) classes.push('streak');
      if (isToday) classes.push('today');
      if (selectedDay === cell.key) classes.push('selected');

      const day = el('button', classes.join(' '));
      day.type = 'button';
      day.appendChild(el('span', 'cal-num', String(parseInt(cell.key.slice(8), 10))));

      const marks = el('span', 'cal-marks');
      const dayGames = gamesOnDay(cell.key);
      const cats = dayCategories(cell.key);
      if (dayGames.length) {
        const anyPlayed = dayGames.some(g => g.played && g.stats);
        marks.appendChild(el('span', 'cal-game' + (anyPlayed ? '' : ' scheduled')));
      }
      if (cats.length) {
        cats.forEach(cat => {
          const dot = el('span', 'cal-dot');
          dot.style.background = cat.color;
          marks.appendChild(dot);
        });
      } else if (!dayGames.length && entry && entry.event === 'rest') {
        marks.appendChild(el('span', 'cal-rest'));
      } else if (!dayGames.length && entry && entry.event === 'missed') {
        marks.appendChild(el('span', 'cal-missed', '✕'));
      }
      day.appendChild(marks);

      const label = [formatDayTitle(cell.key)];
      if (dayGames.length) label.push(dayGames.some(g => g.played) ? 'game played' : 'game scheduled');
      if (cats.length) label.push(cats.length + ' workout categories');
      else if (entry && entry.event === 'rest') label.push('rest day');
      else if (entry && entry.event === 'missed') label.push('missed');
      if (isToday) label.push('today');
      day.setAttribute('aria-label', label.join(', '));
      if (isFuture) day.classList.add('future');

      day.addEventListener('click', () => {
        selectedDay = selectedDay === cell.key ? null : cell.key;
        render();
      });
      grid.appendChild(day);
    });
    calendarCard.appendChild(grid);

    const legend = el('div', 'cal-legend');
    const dotKey = el('span');
    const sampleDot = el('span', 'cal-dot');
    sampleDot.style.background = cssVar('--accent');
    dotKey.appendChild(sampleDot);
    dotKey.appendChild(document.createTextNode('Category trained'));
    const restKey = el('span');
    restKey.appendChild(el('span', 'cal-rest'));
    restKey.appendChild(document.createTextNode('Rest day'));
    const missKey = el('span');
    missKey.appendChild(el('span', 'cal-missed', '✕'));
    missKey.appendChild(document.createTextNode('Missed'));
    legend.appendChild(dotKey);
    legend.appendChild(restKey);
    legend.appendChild(missKey);
    calendarCard.appendChild(legend);

    const actions = el('div', 'cal-actions');
    const toggle = el('button', 'cal-toggle', calendarMode === 'week' ? 'Expand to month' : 'Collapse to week');
    toggle.type = 'button';
    toggle.id = 'cal-toggle';
    toggle.addEventListener('click', () => {
      calendarMode = calendarMode === 'week' ? 'month' : 'week';
      render();
    });
    actions.appendChild(toggle);
    if (calendarAnchor && calendarAnchor !== today) {
      const todayBtn = el('button', 'cal-toggle', 'Today');
      todayBtn.type = 'button';
      todayBtn.id = 'cal-today';
      todayBtn.addEventListener('click', () => {
        calendarAnchor = null;
        render();
      });
      actions.appendChild(todayBtn);
    }
    calendarCard.appendChild(actions);

    if (selectedDay) calendarCard.appendChild(renderDayDetail(selectedDay, pir));
  }

  function renderDayDetail(dateKey, pir) {
    const wrap = el('div', 'cal-detail');
    const entry = pir.historyByDate.get(dateKey);
    const dayWorkouts = workoutsOnDay(dateKey);
    const isToday = dateKey === pir.today;

    const head = el('div', 'cal-detail-head');
    head.appendChild(el('div', 'cal-detail-date', isToday ? 'Today' : formatDayTitle(dateKey)));

    const pirEl = el('div', 'cal-detail-pir');
    if (entry) {
      const delta = entry.delta;
      pirEl.classList.add(delta > 0 ? 'up' : delta < 0 ? 'down' : 'flat');
      const sign = delta > 0 ? '+' : delta < 0 ? '−' : '±';
      pirEl.textContent = sign + Math.abs(delta) + ' PIR';
    } else {
      pirEl.classList.add('flat');
      pirEl.textContent = '—';
    }
    head.appendChild(pirEl);
    wrap.appendChild(head);

    const status = el('div', 'cal-detail-status');
    if (entry && entry.event === 'workout') {
      status.textContent = dayWorkouts.length + (dayWorkouts.length === 1 ? ' workout' : ' workouts')
